            if (d.state === 'attack') {
                ctx.beginPath();
                ctx.moveTo(-10, -42);
                ctx.quadraticCurveTo(0, -38, 10, -42);
                ctx.lineTo(12, -36);
                ctx.quadraticCurveTo(0, -30, -12, -36);
                ctx.closePath();
                ctx.fillStyle = '#5d0000';
                ctx.fill();
                ctx.strokeStyle = '#8b1a1a';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(-12, -36);
                ctx.quadraticCurveTo(0, -30, 12, -36);
                ctx.lineTo(10, -28);
                ctx.quadraticCurveTo(0, -22, -10, -28);
                ctx.closePath();
                ctx.fillStyle = '#5d0000';
                ctx.fill();
                ctx.strokeStyle = '#8b1a1a';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                ctx.beginPath();
                ctx.ellipse(0, -34, 9, 7, 0, 0, Math.PI * 2);
                ctx.fillStyle = '#3a0000';
                ctx.fill();

                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.moveTo(-8, -41); ctx.lineTo(-6, -37); ctx.lineTo(-4, -41);
                ctx.closePath();
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(-1, -40); ctx.lineTo(1, -36); ctx.lineTo(3, -40);
                ctx.closePath();
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(5, -41); ctx.lineTo(7, -37); ctx.lineTo(9, -41);
                ctx.closePath();
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(-7, -28); ctx.lineTo(-5, -32); ctx.lineTo(-3, -28);
                ctx.closePath();
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(2, -28); ctx.lineTo(4, -32); ctx.lineTo(6, -28);
                ctx.closePath();
                ctx.fill();

                ctx.beginPath();
                ctx.ellipse(0, -31, 5, 3, 0, 0, Math.PI * 2);
                ctx.fillStyle = '#ff5252';
                ctx.fill();

                ctx.save();
                ctx.globalAlpha = 0.6;
                const mouthGlow = ctx.createRadialGradient(-12, -34, 2, -12, -34, 25);
                mouthGlow.addColorStop(0, '#ffffff');
                mouthGlow.addColorStop(0.3, '#ffdd44');
                mouthGlow.addColorStop(0.7, '#ff6622');
                mouthGlow.addColorStop(1, 'rgba(255,60,0,0)');
                ctx.beginPath();
                ctx.arc(-12, -34, 25, 0, Math.PI * 2);
                ctx.fillStyle = mouthGlow;
                ctx.fill();
                ctx.restore();

            } else if (d.state === 'hurt') {
                ctx.beginPath();
                ctx.ellipse(0, -38, 6, 5, 0, 0, Math.PI * 2);
                ctx.fillStyle = '#3a0000';
                ctx.fill();
                ctx.strokeStyle = '#8b1a1a';
                ctx.lineWidth = 1.5;
                ctx.stroke();
            } else {
                ctx.beginPath();
                ctx.moveTo(-8, -40);
                ctx.quadraticCurveTo(0, -34, 8, -40);
                ctx.strokeStyle = '#8b1a1a';
                ctx.lineWidth = 2;
                ctx.fillStyle = '#3a0000';
                ctx.fill();
                ctx.stroke();
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.moveTo(-5, -39); ctx.lineTo(-3, -35); ctx.lineTo(-1, -39);
                ctx.closePath();
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(2, -39); ctx.lineTo(4, -35); ctx.lineTo(6, -39);
                ctx.closePath();
                ctx.fill();
            }

            ctx.fillStyle = '#8b1a1a';
            ctx.beginPath();
            ctx.arc(-4, -56, 1.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(4, -56, 1.5, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ffb74d';
            ctx.strokeStyle = '#e65100';
            ctx.lineWidth = 1;
            for (let i = 0; i < 3; i++) {
                const bx = -8 + i * 8;
                const by = -70 + i * 3;
                ctx.beginPath();
                ctx.moveTo(bx, by);
                ctx.lineTo(bx + 4, by - 10);
                ctx.lineTo(bx + 8, by);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
            }

            ctx.restore();
        }

        function drawSlashEffects() {
            characterState.slashEffects.forEach(s => {
                ctx.save();
                ctx.globalAlpha = Math.max(0, s.life);
                ctx.translate(s.x, s.y);
                ctx.rotate(s.angle);
                const grad = ctx.createLinearGradient(-s.length / 2, 0, s.length / 2, 0);
                grad.addColorStop(0, 'transparent');
                grad.addColorStop(0.5, '#ffffff');
                grad.addColorStop(1, 'transparent');
                ctx.strokeStyle = grad;
                ctx.lineWidth = 3;
                ctx.lineCap = 'round';
                ctx.shadowColor = '#ffffff';
                ctx.shadowBlur = 12;
                ctx.beginPath();
                ctx.moveTo(-s.length / 2, 0);
                ctx.lineTo(s.length / 2, 0);
                ctx.stroke();
                ctx.restore();
            });
        }

        function drawFireEffects() {
            characterState.fireEffects.forEach(f => {
                ctx.save();
                ctx.globalAlpha = Math.max(0, f.life);
                const grad = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.size);
                grad.addColorStop(0, '#ffffff');
                grad.addColorStop(0.25, '#ffdd44');
                grad.addColorStop(0.55, '#ff6622');
                grad.addColorStop(0.85, '#d32f2f');
                grad.addColorStop(1, 'rgba(255, 60, 0, 0)');
                ctx.beginPath();
                ctx.arc(f.x, f.y, f.size * (1 + (1 - f.life) * 0.6), 0, Math.PI * 2);
                ctx.fillStyle = grad;
                ctx.shadowColor = '#ff4400';
                ctx.shadowBlur = 20;
                ctx.fill();
                ctx.restore();
            });
        }

        function draw() {
            ctx.clearRect(0, 0, canvasWidth, canvasHeight);

            drawKyotoBackground();
            drawWall();

            drawDragon();
            drawSamurai();

            activeWords.forEach(w => drawWordCard(w.x, w.y, w.width, w.height, w.text));
            slicedPieces.forEach(p => drawSlicePiece(p));
            drawBladeTrails();
            drawExplosions();

            drawSlashEffects();
            drawFireEffects();

            drawFloatingTexts();

            if (gameVictory) {
                drawFireworks();
            }
        }

        function gameLoop(now) {
            if (!lastTimestamp) {
                lastTimestamp = now;
                animationFrame = requestAnimationFrame(gameLoop);
                return;
            }
            const deltaSec = Math.min(0.1, (now - lastTimestamp) / 1000);
            lastTimestamp = now;

            updateClouds(deltaSec);
            sakuraSwayTime += deltaSec;

            if (gameVictory) {
                updateFireworks(deltaSec);
                autoLaunchFireworks(deltaSec);
                draw();
                animationFrame = requestAnimationFrame(gameLoop);
                return;
            }

            if (!gameStarted || gamePaused || !gameRunning) {
                draw();
                animationFrame = requestAnimationFrame(gameLoop);
                return;
            }

            spawnTimer += deltaSec;
            if (spawnTimer >= SPAWN_INTERVAL && spawnQueue.length > 0) {
                spawnWord();
                spawnTimer = 0;
            }

            updatePositions(deltaSec);
            draw();
            animationFrame = requestAnimationFrame(gameLoop);
        }

        function showStartOverlay() {
            startOverlay.classList.add('active');
        }

        function hideStartOverlay() {
            startOverlay.classList.remove('active');
        }

        function startGameAfterDifficulty() {
            gameStarted = true;
            gamePaused = false;
            difficultyChosen = true;
            lastTimestamp = 0;
            spawnTimer = 0;

            activeWords = [];

            pauseBtn.classList.remove('hidden');

            initAudio();
            spawnWord();
            showStatus('游戏开始！点击飘落的单词', true);
        }

        function startGame() {
            hideStartOverlay();
            showDifficultyOverlay();
        }

        function pauseGame() {
            if (!gameStarted || gameOver || gameVictory) return;
            gamePaused = true;
            startIcon.textContent = '⏸';
            startTitle.textContent = '已暂停';
            startSub.textContent = '点击继续游戏';
            startHint.textContent = '再次点击屏幕继续';
            showStartOverlay();
        }

        function resumeGame() {
            if (!gameStarted || gameOver || gameVictory) return;
            gamePaused = false;
            hideStartOverlay();
            lastTimestamp = 0;
            showStatus('继续游戏', true);
        }

        startOverlay.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            if (!gameStarted && !difficultyChosen) {
                startGame();
            } else if (gamePaused) {
                resumeGame();
            }
        });
        startOverlay.addEventListener('touchstart', (e) => {
            e.preventDefault();
            e.stopPropagation();
            if (!gameStarted && !difficultyChosen) {
                startGame();
            } else if (gamePaused) {
                resumeGame();
            }
        }, { passive: false });

        pauseBtn.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            if (!gameStarted || gameOver || gameVictory) return;
            if (gamePaused) {
                resumeGame();
            } else {
                pauseGame();
            }
        });
        pauseBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            e.stopPropagation();
            if (!gameStarted || gameOver || gameVictory) return;
            if (gamePaused) {
                resumeGame();
            } else {
                pauseGame();
            }
        }, { passive: false });

        function handleCanvasTap(e) {
            e.preventDefault();

            if (!gameStarted || gamePaused) return;
            if (!gameRunning || gameOver) return;
            initAudio();

            const rect = canvas.getBoundingClientRect();
            const scaleX = canvasWidth / rect.width;
            const scaleY = canvasHeight / rect.height;

            let clientX, clientY;
            if (e.touches) {
                if (e.touches.length === 0) return;
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }

            const canvasX = (clientX - rect.left) * scaleX;
            const canvasY = (clientY - rect.top) * scaleY;

            for (let i = activeWords.length - 1; i >= 0; i--) {
                const w = activeWords[i];
                const hitPadding = 8;
                if (canvasX >= w.x - hitPadding && canvasX <= w.x + w.width + hitPadding &&
                    canvasY >= w.y - hitPadding && canvasY <= w.y + w.height + hitPadding) {

                    const isGodan = GODAN_SET.has(w.text);

                    if (isGodan) {
                        correctCount++;
                        masteredGodan.add(w.text);
                        showStatus(`✓ 「${w.text}」是五段动词！`, true);
                        playCorrectSound();
                        triggerSamuraiJumpAttack();

                        if (masteredGodan.size >= GODAN_VERBS.length) {
                            sliceWord(w, isGodan, canvasX, canvasY);
                            activeWords.splice(i, 1);
                            triggerVictory();
                            return;
                        }
                    } else {
                        wrongCount++;
                        currentHealth = Math.max(0, currentHealth - 1);
                        updateHealthUI();
                        showStatus(`✗ 「${w.text}」不是五段动词！ -1 ❤️`, false);
                        triggerDragonAttack();
                    }

                    sliceWord(w, isGodan, canvasX, canvasY);
                    activeWords.splice(i, 1);

                    if (currentHealth <= 0) {
                        triggerGameOver();
                    }
                    return;
                }
            }
        }

        function restartGame() {
            gameOver = false;
            gameVictory = false;
            gameRunning = true;
            currentHealth = MAX_HEALTH;
            correctCount = 0;
            wrongCount = 0;
            missCount = 0;
            masteredGodan.clear();

            spawnQueue = shuffleArray(ORIGINAL_POOL);
            spawnIndex = 0;

            characterState.samurai = {
                state: 'idle', timer: 0, jumpProgress: 0, slashTriggered: false
            };
            characterState.dragon = { state: 'idle', timer: 0 };
            characterState.slashEffects = [];
            characterState.fireEffects = [];
            floatingTexts = [];
            fireworks = [];
            fireworkSparks = [];

            updateHealthUI();
            activeWords = [];
            slicedPieces = [];
            bladeTrails = [];
            explosions = [];
            spawnTimer = 0;
            lastTimestamp = 0;
            statusMsg.textContent = '';
            gameoverOverlay.classList.remove('active');
            victoryOverlay.classList.remove('active');

            gameStarted = false;
            gamePaused = false;
            difficultyChosen = false;
            hideDifficultyOverlay();

            pauseBtn.classList.add('hidden');

            startIcon.textContent = '⛩';
            startTitle.textContent = '点击开始';
            startSub.textContent = '五段动词判断 · 京都道場';
            startHint.textContent = '点击或触摸屏幕开始游戏';
            showStartOverlay();

            if (!animationFrame) {
                lastTimestamp = 0;
                animationFrame = requestAnimationFrame(gameLoop);
            }
        }

        function requestAddNewWord() {
            const raw = newWordInput.value.trim();
            if (!raw) { showStatus('请输入单词', false); return; }
            const words = raw.split(/[\s,，、]+/).filter(w => w.length > 0);
            if (words.length === 0) { showStatus('没有有效的单词', false); return; }

            requestPassword(
                '🔒 添加单词',
                `确定添加 ${words.length} 个单词？请输入密码`,
                () => {
                    let addedCount = 0;
                    words.forEach(w => {
                        if (!ORIGINAL_POOL.includes(w)) { ORIGINAL_POOL.push(w); addedCount++; }
                    });

                    if (addedCount > 0) {
                        updateWordListDisplay();
                        newWordInput.value = '';
                        spawnQueue = spawnQueue.concat(words.filter(w => !spawnQueue.includes(w)));
                        if (gameRunning && gameStarted && !gamePaused && !gameOver && activeWords.length === 0) spawnWord();
                        showStatus(`添加了 ${addedCount} 个单词，正在同步…`, true);
                        saveWordPool().then(ok => {
                            if (ok) showStatus(`✅ 已同步 ${addedCount} 个单词`, true);
                        });
                    } else {
                        showStatus('单词已存在或无效', false);
                    }
                }
            );
        }

        function initGame() {
            resizeCanvas();
            initClouds();
            updateWordListDisplay();
            updateHealthUI();
            baseSpeedFactor = 3.0;
            currentDifficultyDisplay.textContent = '简单 3.0x';

            spawnQueue = shuffleArray(ORIGINAL_POOL);
            spawnIndex = 0;

            activeWords = [];
            slicedPieces = [];
            bladeTrails = [];
            explosions = [];
            floatingTexts = [];
            fireworks = [];
            fireworkSparks = [];
            currentHealth = MAX_HEALTH;
            correctCount = 0;
            wrongCount = 0;
            missCount = 0;
            gameOver = false;
            gameVictory = false;
            gameStarted = false;
            gamePaused = false;
            difficultyChosen = false;
            masteredGodan.clear();
            updateHealthUI();

            characterState.samurai = {
                state: 'idle', timer: 0, jumpProgress: 0, slashTriggered: false
            };
            characterState.dragon = { state: 'idle', timer: 0 };
            characterState.slashEffects = [];
            characterState.fireEffects = [];

            pauseBtn.classList.add('hidden');

            canvas.addEventListener('touchstart', handleCanvasTap, { passive: false });
            canvas.addEventListener('mousedown', handleCanvasTap);
            canvas.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });

            addWordBtn.addEventListener('click', requestAddNewWord);
            newWordInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') { e.preventDefault(); requestAddNewWord(); }
            });
            restartBtn.addEventListener('click', restartGame);
            restartBigBtn.addEventListener('click', restartGame);
            victoryBtn.addEventListener('click', restartGame);
            clearAllBtn.addEventListener('click', requestClearAll);

            if (animationFrame) cancelAnimationFrame(animationFrame);
            lastTimestamp = 0;
            spawnTimer = 0;
            gameRunning = true;
            animationFrame = requestAnimationFrame(gameLoop);
        }

        window.addEventListener('load', async () => {
            resizeCanvas();
            showStatus('正在从 GitHub 加载词库…', true);
            ORIGINAL_POOL = await loadWordPool();
            initGame();
            showStatus(`✅ 已加载 ${ORIGINAL_POOL.length} 个单词`, true);
        });

        if (window.ResizeObserver) {
            const ro = new ResizeObserver(() => resizeCanvas());
            ro.observe(container);
        }

        window.addEventListener('touchmove', (e) => {
            if (e.target.closest('.canvas-container')) e.preventDefault();
        }, { passive: false });

    })();
</script>
</body>
</html>
