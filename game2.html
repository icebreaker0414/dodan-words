<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>单词救援行动 · 日语て形</title>
<style>
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at 50% 0%, #1d2431 0%, #0a0c11 70%);
    color: #e6edf5;
    font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px 12px 40px;
    overscroll-behavior: none;
  }
  h1 {
    font-size: 20px;
    letter-spacing: 4px;
    color: #8fd6ff;
    text-shadow: 0 0 18px rgba(90,190,255,.6);
    margin: 4px 0 6px;
    font-weight: 700;
  }
  .sub {
    font-size: 13px;
    color: #7f93a8;
    letter-spacing: 1px;
    margin-bottom: 12px;
  }
  .sub b { color: #ffd166; }
  #wrap { width: min(96vw, 900px); }

  .hud {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 12px 10px;
    font-size: 15px;
    color: #9fb2c6;
    letter-spacing: 1px;
    gap: 12px;
    flex-wrap: wrap;
  }
  .hud b { color: #ffd166; font-size: 18px; }
  .hud-right {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  #lives { font-size: 18px; letter-spacing: 2px; }
  #groupTag {
    font-size: 13px;
    color: #8fd6ff;
    border: 1px solid #2b6f92;
    background: rgba(43,111,146,.15);
    padding: 4px 10px;
    border-radius: 14px;
    letter-spacing: 1px;
  }

  .mini-btn {
    padding: 8px 14px;
    font-family: inherit;
    font-size: 13px;
    letter-spacing: 1px;
    border-radius: 20px;
    cursor: pointer;
    border: 1.5px solid #3a4859;
    background: rgba(35, 43, 56, 0.8);
    color: #9fb2c6;
    transition: all .15s;
    white-space: nowrap;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
  }
  .mini-btn:hover {
    border-color: #5fd0ff;
    color: #8fd6ff;
    box-shadow: 0 0 14px rgba(95,208,255,.35);
  }
  .mini-btn:active {
    transform: scale(0.96);
    border-color: #5fd0ff;
  }

  .stage { position: relative; }

  canvas {
    width: 100%;
    display: block;
    border-radius: 12px;
    border: 2px solid #2b3646;
    box-shadow: 0 0 40px rgba(0,0,0,.8), inset 0 0 60px rgba(0,0,0,.6);
    background: #0d1017;
    touch-action: manipulation;
  }

  #options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 12px;
  }
  @media (max-width: 560px) {
    #options { grid-template-columns: 1fr; }
  }

  .opt {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    font-family: inherit;
    font-size: 19px;
    color: #e6edf5;
    background: linear-gradient(#232b38, #171c25);
    border: 2px solid #3a4859;
    border-radius: 10px;
    cursor: pointer;
    transition: border-color .15s, box-shadow .15s, transform .1s, background .15s;
    text-align: left;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
    min-height: 54px;
  }
  .opt .key {
    flex: 0 0 auto;
    width: 28px; height: 28px;
    display: grid; place-items: center;
    border-radius: 7px;
    background: #3a4859;
    font-weight: 700;
    font-size: 15px;
    color: #cfe4f7;
    transition: background .15s;
  }
  .opt:hover:not(:disabled) {
    border-color: #5fd0ff;
    box-shadow: 0 0 16px rgba(95,208,255,.45);
    transform: translateY(-2px);
  }
  .opt:hover:not(:disabled) .key { background: #2b6f92; }

  .opt:active:not(:disabled) {
    border-color: #5fd0ff;
    background: linear-gradient(#2a3a4a, #1d2730);
    transform: scale(0.98);
    box-shadow: 0 0 20px rgba(95,208,255,.55);
  }
  .opt:disabled { cursor: default; opacity: .72; }

  .opt.correct {
    border-color: #3ddc84;
    background: linear-gradient(#17392a, #0f2a1d);
    box-shadow: 0 0 20px rgba(61,220,132,.55);
    opacity: 1;
    animation: correctPulse 0.5s ease;
  }
  .opt.correct .key { background: #2a8a55; color: #eafff3; }

  .opt.wrong {
    border-color: #ff5050;
    background: linear-gradient(#3a1616, #2a0f0f);
    box-shadow: 0 0 20px rgba(255,80,80,.55);
    opacity: 1;
    animation: wrongShake 0.4s ease;
  }
  .opt.wrong .key { background: #a32b2b; color: #ffecec; }

  @keyframes correctPulse {
    0% { transform: scale(1); }
    45% { transform: scale(1.04); }
    100% { transform: scale(1); }
  }
  @keyframes wrongShake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }

  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: rgba(5,8,12,.88);
    border-radius: 12px;
    backdrop-filter: blur(3px);
    text-align: center;
    padding: 20px;
    animation: overlayIn 0.4s ease;
  }
  #overlay.hidden { display: none; }
  @keyframes overlayIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  #ovTitle {
    font-size: clamp(26px, 5vw, 44px);
    letter-spacing: 6px;
    margin: 0;
    text-shadow: 0 0 26px currentColor;
  }
  #ovText { font-size: clamp(14px, 2.4vw, 17px); color: #a9bdd2; line-height: 1.9; margin: 0; }
  #ovText b { color: #ffd166; font-size: 1.25em; }

  .btn-primary {
    padding: 12px 28px;
    font-family: inherit;
    font-size: 15px;
    letter-spacing: 2px;
    border-radius: 30px;
    cursor: pointer;
    border: none;
    background: linear-gradient(#7fe0ff, #35b6e6);
    color: #06202b;
    font-weight: 700;
    transition: transform .12s, box-shadow .12s;
    box-shadow: 0 0 22px rgba(80,200,255,.5);
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
  }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 0 32px rgba(80,200,255,.85); }
  .btn-primary:active { transform: scale(0.96); }

  .btn-ghost {
    padding: 12px 24px;
    font-family: inherit;
    font-size: 15px;
    letter-spacing: 2px;
    border-radius: 30px;
    cursor: pointer;
    border: 1.5px solid #3a4859;
    background: transparent;
    color: #9fb2c6;
    transition: all .15s;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
  }
  .btn-ghost:hover { border-color: #5fd0ff; color: #8fd6ff; }
  .btn-ghost:active { transform: scale(0.96); border-color: #5fd0ff; }

  .ov-btns { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-top: 6px; }

  .tip { margin-top: 14px; font-size: 13px; color: #5a6b7d; letter-spacing: 1px; text-align: center; }
  .tip b { color: #ff9a6b; }

  /* ============ 开始菜单 ============ */
  #menu {
    position: fixed;
    inset: 0;
    z-index: 900;
    background: radial-gradient(circle at 50% 20%, #1a2330 0%, #06080c 70%);
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 16px 60px;
    transition: opacity 0.38s ease, transform 0.38s ease;
    opacity: 1;
  }
  #menu.fade-out {
    opacity: 0;
    transform: scale(0.97);
    pointer-events: none;
  }
  #menu.hidden { display: none; }

  .menu-title {
    font-size: clamp(24px, 5vw, 40px);
    letter-spacing: 8px;
    color: #8fd6ff;
    text-shadow: 0 0 30px rgba(90,190,255,.7);
    margin: 0 0 8px;
    font-weight: 700;
    text-align: center;
    animation: menuTitleIn 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  @keyframes menuTitleIn {
    from { opacity: 0; transform: translateY(-18px) scale(0.96); letter-spacing: 16px; }
    to   { opacity: 1; transform: translateY(0) scale(1); letter-spacing: 8px; }
  }

  .menu-sub {
    font-size: clamp(13px, 2vw, 15px);
    color: #7f93a8;
    letter-spacing: 3px;
    margin: 0 0 34px;
    text-align: center;
    animation: menuSubIn 1s cubic-bezier(0.22, 1, 0.36, 1) 0.15s both;
  }
  .menu-sub b { color: #ffd166; }
  @keyframes menuSubIn {
    from { opacity: 0; transform: translateY(-10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .group-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 16px;
    width: min(94vw, 820px);
  }

  .group-card {
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 22px 18px 18px;
    font-family: inherit;
    text-align: left;
    cursor: pointer;
    border-radius: 16px;
    border: 2px solid #2b3646;
    color: #e6edf5;
    overflow: hidden;
    background:
      linear-gradient(135deg,
        rgba(95,208,255,0.06) 0%,
        rgba(95,208,255,0) 45%,
        rgba(143,214,255,0.09) 100%),
      linear-gradient(160deg, #1d2634 0%, #12171f 60%, #1a2433 100%);
    background-size: 220% 220%, 100% 100%;
    background-position: 0% 0%, 0 0;
    opacity: 0;
    transform: translateY(30px);
    transition:
      border-color .25s ease,
      box-shadow .25s ease,
      transform .18s ease,
      background-position .7s ease;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
  }

  .group-card:nth-child(1) { animation: cardFadeIn 0.75s cubic-bezier(0.22, 1, 0.36, 1) 0.15s forwards; }
  .group-card:nth-child(2) { animation: cardFadeIn 0.75s cubic-bezier(0.22, 1, 0.36, 1) 0.28s forwards; }
  .group-card:nth-child(3) { animation: cardFadeIn 0.75s cubic-bezier(0.22, 1, 0.36, 1) 0.41s forwards; }
  .group-card:nth-child(4) { animation: cardFadeIn 0.75s cubic-bezier(0.22, 1, 0.36, 1) 0.54s forwards; }
  .group-card:nth-child(5) { animation: cardFadeIn 0.75s cubic-bezier(0.22, 1, 0.36, 1) 0.67s forwards; }

  @keyframes cardFadeIn {
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .group-card:hover,
  .group-card:active {
    border-color: #5fd0ff;
    box-shadow: 0 0 30px rgba(95,208,255,.45), inset 0 0 30px rgba(95,208,255,.06);
    background-position: 100% 100%, 0 0;
    transform: translateY(-3px);
  }
  .group-card:active {
    transform: translateY(-1px) scale(0.985);
  }

  .group-card::after {
    content: '';
    position: absolute;
    top: 0; left: -60%;
    width: 50%; height: 100%;
    background: linear-gradient(100deg,
      rgba(255,255,255,0) 0%,
      rgba(143,214,255,0.16) 50%,
      rgba(255,255,255,0) 100%);
    transform: skewX(-18deg);
    pointer-events: none;
    transition: left 0.7s ease;
  }
  .group-card:hover::after,
  .group-card:active::after {
    left: 130%;
  }

  .group-card::before {
    content: '';
    position: absolute;
    top: 16px; right: 18px;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #3ddc84;
    box-shadow: 0 0 12px #3ddc84;
    animation: dotPulse 2.2s ease-in-out infinite;
  }
  @keyframes dotPulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.55; transform: scale(0.75); }
  }

  .group-name {
    font-size: 21px;
    font-weight: 700;
    letter-spacing: 3px;
    background: linear-gradient(90deg, #8fd6ff, #b6e4ff, #8fd6ff);
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shineText 3.5s linear infinite;
  }
  @keyframes shineText {
    to { background-position: 200% center; }
  }

  .group-count {
    font-size: 12px;
    color: #5f7286;
    letter-spacing: 1px;
  }
  .group-words {
    font-size: 13px;
    line-height: 1.9;
    color: #9fb2c6;
    letter-spacing: .5px;
    word-break: break-all;
  }

  /* ============ 词库编辑器 ============ */
  #editor {
    position: fixed;
    inset: 0;
    background: rgba(5, 8, 12, 0.97);
    z-index: 1000;
    display: flex;
    flex-direction: column;
    padding: 16px;
    animation: overlayIn 0.3s ease;
  }
  #editor.hidden { display: none; }

  .editor-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 4px 6px 14px;
    border-bottom: 1px solid #2b3646;
    flex-wrap: wrap;
  }
  .editor-header h2 {
    margin: 0;
    font-size: 18px;
    letter-spacing: 3px;
    color: #8fd6ff;
    font-weight: 700;
  }
  .editor-header h2 span { color: #ffd166; }
  .editor-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }

  .btn-save {
    padding: 12px 26px;
    font-family: inherit;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 2px;
    border-radius: 30px;
    cursor: pointer;
    border: none;
    background: linear-gradient(#3ddc84, #22a55e);
    color: #042412;
    box-shadow: 0 0 26px rgba(61,220,132,.7);
    transition: transform .12s, box-shadow .12s;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
    white-space: nowrap;
  }
  .btn-save:hover { transform: translateY(-2px); box-shadow: 0 0 36px rgba(61,220,132,.95); }
  .btn-save:active { transform: scale(0.95); }
  .btn-save.saved {
    background: linear-gradient(#7fe0ff, #35b6e6);
    color: #06202b;
    box-shadow: 0 0 26px rgba(80,200,255,.8);
  }

  #editorList {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 16px 6px 40px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    max-width: 900px;
    width: 100%;
    margin: 0 auto;
  }

  .word-card {
    background: linear-gradient(#1b212c, #141920);
    border: 1px solid #2f3a4b;
    border-radius: 12px;
    padding: 14px 16px;
    flex: 0 0 auto;
  }
  .word-head {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  .word-label {
    font-size: 13px;
    color: #7f93a8;
    letter-spacing: 2px;
    flex: 0 0 auto;
  }
  .word-jp {
    flex: 1;
    min-width: 140px;
    padding: 9px 12px;
    font-size: 16px;
    color: #e6edf5;
    background: #0d1117;
    border: 1.5px solid #3a4859;
    border-radius: 8px;
    font-family: inherit;
    outline: none;
    transition: border-color .15s;
  }
  .word-jp:focus { border-color: #5fd0ff; }

  .opt-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 10px;
  }
  .opt-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .opt-row.is-correct .opt-text {
    border-color: #3ddc84;
    background: #0f2a1d;
    color: #c9ffe2;
  }
  .opt-text {
    flex: 1;
    min-width: 0;
    padding: 9px 12px;
    font-size: 16px;
    color: #e6edf5;
    background: #0d1117;
    border: 1.5px solid #3a4859;
    border-radius: 8px;
    font-family: inherit;
    outline: none;
    transition: border-color .15s, background .15s;
  }
  .opt-text:focus { border-color: #5fd0ff; }

  .btn-mark-correct {
    flex: 0 0 auto;
    padding: 8px 12px;
    font-family: inherit;
    font-size: 13px;
    border-radius: 8px;
    cursor: pointer;
    border: 1.5px solid #3a4859;
    background: #232b38;
    color: #9fb2c6;
    transition: all .15s;
    white-space: nowrap;
    touch-action: manipulation;
  }
  .opt-row.is-correct .btn-mark-correct {
    background: #1d5c3a;
    border-color: #3ddc84;
    color: #c9ffe2;
  }
  .btn-mark-correct:hover { border-color: #5fd0ff; }
  .btn-mark-correct:active { transform: scale(0.95); }

  .btn-del-opt {
    flex: 0 0 auto;
    width: 34px;
    height: 34px;
    font-size: 18px;
    line-height: 1;
    border-radius: 8px;
    cursor: pointer;
    border: 1.5px solid #4a2b2b;
    background: #2a1414;
    color: #ff8a8a;
    transition: all .15s;
    touch-action: manipulation;
  }
  .btn-del-opt:hover:not(:disabled) { background: #4a1a1a; border-color: #ff5050; }
  .btn-del-opt:active:not(:disabled) { transform: scale(0.9); }
  .btn-del-opt:disabled { opacity: 0.3; cursor: not-allowed; }

  .btn-add-opt {
    padding: 8px 14px;
    font-family: inherit;
    font-size: 14px;
    border-radius: 8px;
    cursor: pointer;
    border: 1.5px dashed #3a4859;
    background: transparent;
    color: #7f93a8;
    transition: all .15s;
    touch-action: manipulation;
  }
  .btn-add-opt:hover { border-color: #5fd0ff; color: #8fd6ff; }
  .btn-add-opt:active { transform: scale(0.95); }

  .btn-del-word {
    flex: 0 0 auto;
    padding: 9px 14px;
    font-family: inherit;
    font-size: 13px;
    border-radius: 8px;
    cursor: pointer;
    border: 1.5px solid #4a2b2b;
    background: #2a1414;
    color: #ff8a8a;
    transition: all .15s;
    touch-action: manipulation;
  }
  .btn-del-word:hover { background: #4a1a1a; border-color: #ff5050; }
  .btn-del-word:active { transform: scale(0.95); }

  .editor-hint {
    text-align: center;
    font-size: 12px;
    color: #5a6b7d;
    padding: 10px 0 0;
    max-width: 900px;
    margin: 0 auto;
    width: 100%;
  }
  .editor-hint b { color: #3ddc84; }

  /* 保存状态提示 */
  #saveToast {
    position: fixed;
    left: 50%;
    bottom: 32px;
    transform: translateX(-50%) translateY(20px);
    padding: 14px 24px;
    border-radius: 26px;
    font-size: 14px;
    letter-spacing: 1px;
    line-height: 1.6;
    color: #c9ffe2;
    background: linear-gradient(135deg, rgba(29,92,58,0.96), rgba(15,42,29,0.96));
    border: 1.5px solid #3ddc84;
    box-shadow: 0 0 24px rgba(61,220,132,.5);
    opacity: 0;
    pointer-events: none;
    transition: opacity .3s ease, transform .3s ease;
    z-index: 2000;
    max-width: 90vw;
    text-align: center;
  }
  #saveToast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  #saveToast.err {
    color: #ffecec;
    background: linear-gradient(135deg, rgba(74,26,26,0.96), rgba(42,15,15,0.96));
    border-color: #ff5050;
    box-shadow: 0 0 24px rgba(255,80,80,.5);
  }
  #saveToast small {
    display: block;
    font-size: 11px;
    opacity: .8;
    margin-top: 2px;
  }
</style>
</head>
<body>

<div id="menu">
  <h1 class="menu-title">单词救援行动</h1>
  <p class="menu-sub">选择一组单词，救出人质 —— 选出正确的 <b>て形</b></p>
  <div class="group-grid" id="groupGrid"></div>
</div>

<div id="wrap">
  <div class="hud">
    <div>
      <span id="groupTag">第一组</span>
      &nbsp;已解救：<b id="rescued">0</b> / <b id="target">10</b> ｜ 得分：<b id="score">0</b>
    </div>
    <div class="hud-right">
      <button id="btnEditor" class="mini-btn">✎ 编辑本组词库</button>
      <button id="btnMenu" class="mini-btn">☰ 选择分组</button>
      <div id="lives">❤️❤️❤️</div>
    </div>
  </div>

  <div class="stage">
    <canvas id="cv" width="900" height="520"></canvas>
    <div id="overlay" class="hidden">
      <h2 id="ovTitle">任务失败</h2>
      <p id="ovText"></p>
      <div class="ov-btns">
        <button id="restart" class="btn-primary">再来一次</button>
        <button id="toMenu" class="btn-ghost">返回选组</button>
      </div>
    </div>
  </div>

  <div id="options"></div>

        { jp:'始める',   options:[{text:'始めて',correct:true},{text:'始めって',correct:false},{text:'始めた',correct:false},{text:'始めるて',correct:false}] },
        { jp:'終わる',   options:[{text:'終わって',correct:true},{text:'終わりて',correct:false},{text:'終わるて',correct:false},{text:'終わいで',correct:false}] },
        { jp:'描く',     options:[{text:'描いて',correct:true},{text:'描きて',correct:false},{text:'描くて',correct:false},{text:'描きで',correct:false}] },
        { jp:'寝る',     options:[{text:'寝て',correct:true},{text:'寝って',correct:false},{text:'寝た',correct:false},{text:'寝るて',correct:false}] },
        { jp:'疲れる',   options:[{text:'疲れて',correct:true},{text:'疲れって',correct:false},{text:'疲れた',correct:false},{text:'疲れるて',correct:false}] },
        { jp:'起きる',   options:[{text:'起きて',correct:true},{text:'起きって',correct:false},{text:'起きた',correct:false},{text:'起きるて',correct:false}] },
        { jp:'住む',     options:[{text:'住んで',correct:true},{text:'住みて',correct:false},{text:'住むて',correct:false},{text:'住みで',correct:false}] }

  /* ============ 基础 ============ */
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  const GROUND = 430;
  const MAX_LIVES = 3;
  const STORAGE_KEY = 'jp_word_rescue_v12';
  const TIME_LIMIT = 15;

  const TRUCK_X = 25;
  const CARGO_LEFT = TRUCK_X + 148;
  const CARGO_RIGHT = TRUCK_X + 320;
  const CARGO_CENTER = (CARGO_LEFT + CARGO_RIGHT) / 2;
  const RESCUE_TARGET_X = CARGO_CENTER + 20;

  /* ============ 数据管理 ============ */
  let GROUPS = [];   // 先给空数组，保证任何情况下都是数组

  function deepClone(obj) { return JSON.parse(JSON.stringify(obj)); }

  function normalizeWord(w) {
    const item = { jp: String(w.jp || ''), options: [] };
    const opts = Array.isArray(w.options) ? w.options : [];
    opts.forEach(o => item.options.push({
      text: String(o.text != null ? o.text : ''),
      correct: !!o.correct
    }));
    if (item.options.length === 0) item.options.push({ text: '', correct: true });
    let seen = false;
    item.options.forEach(o => {
      if (o.correct) { if (seen) o.correct = false; else seen = true; }
    });
    if (!seen) item.options[0].correct = true;
    return item;
  }
  function normalizeGroups(raw) {
    if (!Array.isArray(raw) || raw.length === 0) return deepClone(DEFAULT_GROUPS);
    return raw.map(g => ({
      name: String(g.name || '未命名组'),
      words: Array.isArray(g.words) ? g.words.map(normalizeWord) : []
    }));
  }

  function loadFromStorage() {
    let raw = null;
    try { raw = localStorage.getItem(STORAGE_KEY); } catch (e) { /* 忽略 */ }
    if (!raw) {
      try { raw = sessionStorage.getItem(STORAGE_KEY); } catch (e) { /* 忽略 */ }
    }

    if (raw) {
      try {
        const parsed = JSON.parse(raw);
        const normalized = normalizeGroups(parsed);
        if (normalized && normalized.length > 0) {
          GROUPS = normalized;
          console.log('[词库] 已从存储加载，共', GROUPS.length, '组');
          return;
        }
      } catch (e) {
        console.warn('[词库] 解析失败，使用默认数据', e);
      }
    }

    // 兜底：默认数据
    GROUPS = deepClone(DEFAULT_GROUPS);
    console.log('[词库] 使用默认数据，共', GROUPS.length, '组');
  }

  function saveToStorage() {
    const str = JSON.stringify(GROUPS);
    // 1) localStorage
    try {
      localStorage.setItem(STORAGE_KEY, str);
      if (localStorage.getItem(STORAGE_KEY) === str) {
        return { ok: true, mode: 'local' };
      }
    } catch (e) { /* 继续 */ }
    // 2) sessionStorage
    try {
      sessionStorage.setItem(STORAGE_KEY, str);
      if (sessionStorage.getItem(STORAGE_KEY) === str) {
        return { ok: true, mode: 'session' };
      }
    } catch (e) { /* 继续 */ }
    // 3) 内存
    return { ok: false, mode: 'memory' };
  }

  let toastTimer = null;
  function showToast(msg, isError, subMsg) {
    const el = document.getElementById('saveToast');
    el.innerHTML = msg + (subMsg ? '<small>' + subMsg + '</small>' : '');
    el.classList.toggle('err', !!isError);
    el.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
  }

  /* ============ 当前分组 ============ */
  let currentGroupIndex = 0;
  let wordQueue = [];
  let paused = true;

  /* ============ 状态 ============ */
  const state = {
    phase: 'enter',
    timer: 0,
    score: 0,
    lives: MAX_LIVES,
    rescued: 0,
    target: 10,
    word: null,
    options: [],
    buttons: [],
    hostage: null,
    bullet: { active: false, x: 0, y: 0, vx: 0, targetX: 0 },
    particles: [],
    muzzle: 0,
    lightning: { active: false, life: 0, maxLife: 0, flash: 0, segments: [] },
    shake: 0,
    timeLeft: TIME_LIMIT,
    timeUpFlash: 0,
    rescuedGuards: []
  };

  /* ============ 工具 ============ */
  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function getCurrentWords() {
    if (!GROUPS[currentGroupIndex]) return [];
    return GROUPS[currentGroupIndex].words || [];
  }

  /* ============ 关卡生成 ============ */
  function drawWord() {
    const words = getCurrentWords();
    if (words.length === 0) return null;
    if (wordQueue.length === 0) wordQueue = shuffle(words.slice());
    return wordQueue.pop();
  }

  function nextRound() {
    if (state.lives <= 0) { endGame(false); return; }
    if (state.rescued >= state.target) { endGame(true); return; }

    let words = getCurrentWords();
    if (words.length === 0) {
      GROUPS[currentGroupIndex] = deepClone(DEFAULT_GROUPS[currentGroupIndex] || DEFAULT_GROUPS[0]);
      saveToStorage();
      words = getCurrentWords();
      wordQueue = [];
    }

    const word = drawWord();
    if (!word) { endGame(true); return; }
    state.word = word;

    state.options = shuffle(word.options.map(o => ({ text: o.text, correct: o.correct })));

    state.hostage = {
      x: 720, y: GROUND, stopX: 420,
      alpha: 1, walkPhase: 0, fall: 0, dead: false
    };
    state.bullet = { active: false, x: 0, y: 0, vx: 0, targetX: 0 };
    state.particles = [];
    state.muzzle = 0;
    state.lightning = { active: false, life: 0, maxLife: 0, flash: 0, segments: [] };
    state.shake = 0;
    state.timeLeft = TIME_LIMIT;
    state.timeUpFlash = 0;
    state.phase = 'enter';

    renderOptions();
  }

  /* ============ 选项 UI ============ */
  const LETTERS = ['A','B','C','D','E','F','G','H','I','J'];

  function renderOptions() {
    const el = document.getElementById('options');
    el.innerHTML = '';
    state.buttons = [];
    state.options.forEach((opt, i) => {
      const b = document.createElement('button');
      b.className = 'opt';
      b.disabled = true;
      b.innerHTML = '<span class="key">' + (LETTERS[i] || '?') + '</span><span class="txt">' + escapeHtml(opt.text) + '</span>';

      b.addEventListener('pointerdown', (e) => {
        if (e.button !== undefined && e.button !== 0) return;
        e.preventDefault();
        answer(i, b);
      }, { passive: false });

      b.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          answer(i, b);
        }
      });

      el.appendChild(b);
      state.buttons.push(b);
    });
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }

  function setButtonsEnabled(v) {
    state.buttons.forEach(b => {
      if (b.classList.contains('correct') || b.classList.contains('wrong')) return;
      b.disabled = !v;
    });
  }

  /* ============ 作答 ============ */
  function answer(i, btn) {
    if (state.phase !== 'ask') return;

    const chosen = state.options[i];
    const isCorrect = chosen.correct;
    const correctIndex = state.options.findIndex(o => o.correct);

    state.buttons.forEach(b => b.disabled = true);
    if (correctIndex >= 0) state.buttons[correctIndex].classList.add('correct');

    if (isCorrect) {
      state.score += 100;
      state.rescued += 1;
      updateHUD();
      state.phase = 'rescue';
    } else {
      btn.classList.add('wrong');
      state.lives -= 1;
      updateHUD();
      triggerShoot();
    }
  }

  function triggerShoot() {
    state.phase = 'shoot';
    const h = state.hostage;
    state.bullet = { active: true, x: W - 30, y: h.y - 68, vx: -1700, targetX: h.x + 6 };
    state.muzzle = 0.18;
  }

  function timeUp() {
    if (state.phase !== 'ask') return;
    const correctIndex = state.options.findIndex(o => o.correct);
    state.buttons.forEach(b => b.disabled = true);
    if (correctIndex >= 0) state.buttons[correctIndex].classList.add('correct');
    state.lives -= 1;
    state.timeUpFlash = 1;
    updateHUD();
    triggerShoot();
  }

  function generateLightningSegments(targetX, targetY) {
    const segments = [];
    const startX = targetX + (Math.random() - 0.5) * 80;
    const startY = -20;
    const endX = targetX;
    const endY = targetY;
    const steps = 14;
    const main = [];
    for (let i = 0; i <= steps; i++) {
      const t = i / steps;
      const jitterX = (i === 0 || i === steps) ? 0 : (Math.random() - 0.5) * 55 * (1 - t * 0.3);
      const jitterY = (i === 0 || i === steps) ? 0 : (Math.random() - 0.5) * 10;
      const x = startX + (endX - startX) * t + jitterX;
      const y = startY + (endY - startY) * t + jitterY;
      main.push({ x, y });
    }
    segments.push({ points: main, width: 3.6 });

    const branchCount = 3 + Math.floor(Math.random() * 3);
    for (let b = 0; b < branchCount; b++) {
      const startIdx = 3 + Math.floor(Math.random() * (steps - 6));
      const anchor = main[startIdx];
      const dir = Math.random() < 0.5 ? -1 : 1;
      const branch = [{ x: anchor.x, y: anchor.y }];
      let bx = anchor.x, by = anchor.y;
      const len = 4 + Math.floor(Math.random() * 3);
      for (let i = 0; i < len; i++) {
        bx += dir * (8 + Math.random() * 16) + (Math.random() - 0.5) * 12;
        by += 10 + Math.random() * 16;
        branch.push({ x: bx, y: by });
      }
      segments.push({ points: branch, width: 1.8 });
    }
    return segments;
  }

  function hitHostage() {
    const h = state.hostage;
    for (let i = 0; i < 30; i++) {
      const life = 0.5 + Math.random() * 0.6;
      state.particles.push({
        x: h.x + 4, y: h.y - 68,
        vx: (Math.random() - 0.5) * 430,
        vy: (Math.random() - 1.0) * 380,
        r: 2 + Math.random() * 4,
        color: Math.random() < 0.7 ? '#c0392b' : '#ff6b5b',
        life: life, maxLife: life
      });
    }
    h.dead = true;
    state.phase = 'dying';

    state.lightning = {
      active: true,
      life: 0.6,
      maxLife: 0.6,
      flash: 1.0,
      segments: generateLightningSegments(h.x, h.y - 80)
    };
    state.shake = 0.45;
  }

  /* ============ 更新 ============ */
  function update(dt) {
    for (const p of state.particles) {
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 900 * dt;
      p.life -= dt;
    }
    state.particles = state.particles.filter(p => p.life > 0);

    if (state.muzzle > 0) state.muzzle -= dt;
    if (state.timeUpFlash > 0) state.timeUpFlash = Math.max(0, state.timeUpFlash - dt * 2.5);

    const L = state.lightning;
    if (L && L.active) {
      L.life -= dt;
      L.flash = Math.max(0, L.flash - dt * 3.2);
      if (L.life <= 0) L.active = false;
    }
    if (state.shake > 0) state.shake = Math.max(0, state.shake - dt * 1.5);

    if (state.phase === 'over') return;
    const h = state.hostage;
    if (!h) return;

    if (state.phase === 'ask') {
      state.timeLeft -= dt;
      if (state.timeLeft <= 0) {
        state.timeLeft = 0;
        timeUp();
        return;
      }
    }

    switch (state.phase) {
      case 'enter':
        h.x -= 320 * dt;
        h.walkPhase += dt * 13;
        if (h.x <= h.stopX) {
          h.x = h.stopX; h.walkPhase = 0;
          state.phase = 'ask';
          state.timeLeft = TIME_LIMIT;
          setButtonsEnabled(true);
        }
        break;

      case 'ask':
        h.walkPhase = 0;
        break;

      case 'rescue': {
        const targetX = RESCUE_TARGET_X;
        if (h.x > targetX) {
          h.x -= 220 * dt;
          h.walkPhase += dt * 12;
        } else {
          h.x = targetX;
          h.y -= 60 * dt;
          h.alpha -= dt * 1.6;
          h.walkPhase += dt * 6;
          if (h.alpha <= 0) {
            h.alpha = 0;
            state.rescuedGuards.push({ phase: Math.random() * Math.PI * 2 });
            state.phase = 'wait';
            state.timer = 0.5;
          }
        }
        break;
      }

      case 'shoot': {
        const b = state.bullet;
        if (b.active) {
          b.x += b.vx * dt;
          if (b.x <= b.targetX) { b.active = false; hitHostage(); }
        }
        break;
      }
      case 'dying':
        h.fall = Math.min(1, h.fall + dt * 3.4);
        if (h.fall >= 1) {
          state.phase = 'wait';
          state.timer = 1.35;
        }
        break;

      case 'wait':
        state.timer -= dt;
        if (state.timer <= 0) nextRound();
        break;
    }
  }

  function drawRescuedGuards() {
    const guards = state.rescuedGuards;
    const n = guards.length;
    if (n === 0) return;

    const now = performance.now() / 1000;
    const padding = 16;
    const innerLeft = CARGO_LEFT + padding;
    const innerRight = CARGO_RIGHT - padding;
    const usable = innerRight - innerLeft;

    let spacing;
    if (n === 1) spacing = 0;
    else spacing = usable / (n - 1);

    const scale = Math.max(0.62, Math.min(1, spacing / 22));
    const baseY = GROUND - 60;

    guards.forEach((g, i) => {
      const x = n === 1 ? (innerLeft + innerRight) / 2 : innerLeft + spacing * i;
      const bob = Math.sin(now * 2 + g.phase) * 1.2;

      ctx.beginPath(); ctx.moveTo(2,-104); ctx.lineTo(6,-99); ctx.moveTo(6,-104); ctx.lineTo(2,-99); ctx.stroke();
    }
    ctx.restore();
  }

  function drawBubble() {
    const h = state.hostage;
    if (!h || h.alpha <= 0) return;
    if (state.phase !== 'ask' && state.phase !== 'enter' && state.phase !== 'rescue') return;
    if (!state.word) return;

    const txt = state.word.jp || '？';
    const fs = txt.length >= 4 ? 26 : 32;

    ctx.save();
    ctx.font = 'bold ' + fs + 'px "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", "PingFang SC", sans-serif';
    const tw = ctx.measureText(txt).width;
    const bw = Math.max(tw + 48, 138);
    const bh = 64;
    const bx = h.x - bw / 2;
    const by = h.y - 210 + Math.sin(performance.now() / 420) * 2.5;

    ctx.shadowColor = 'rgba(110,200,255,0.9)';
    ctx.shadowBlur = 20;

    ctx.fillStyle = 'rgba(246,251,255,0.97)';
    rr(bx, by, bw, bh, 14); ctx.fill();

    ctx.beginPath();
    ctx.moveTo(h.x - 12, by + bh - 1);
    ctx.lineTo(h.x, by + bh + 18);
    ctx.lineTo(h.x + 12, by + bh - 1);
    ctx.closePath(); ctx.fill();

    ctx.shadowBlur = 0;

    ctx.fillStyle = '#0e1720';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(txt, h.x, by + bh / 2 + 4);

    ctx.font = '11px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillStyle = 'rgba(90,120,150,0.85)';
    ctx.fillText('原形', h.x, by + 11);

    ctx.restore();
    ctx.textAlign = 'start';
    ctx.textBaseline = 'alphabetic';
  }

  function drawEffects() {
    if (state.muzzle > 0 && state.bullet.y) {
      ctx.save();
      ctx.globalAlpha = Math.min(1, state.muzzle * 9);
      const mx = W - 30, my = state.bullet.y;
      const g2 = ctx.createRadialGradient(mx, my, 0, mx, my, 70);
      g2.addColorStop(0, 'rgba(255,245,190,0.95)');
      g2.addColorStop(0.4, 'rgba(255,190,70,0.5)');
      g2.addColorStop(1, 'rgba(255,160,40,0)');
      ctx.fillStyle = g2;
      ctx.beginPath(); ctx.arc(mx, my, 70, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    if (state.bullet.active) {
      ctx.save();
      ctx.strokeStyle = '#ffe066';
      ctx.lineWidth = 3.5;
      ctx.lineCap = 'round';
      ctx.shadowColor = '#ffcc33';
      ctx.shadowBlur = 16;
      ctx.beginPath();
      ctx.moveTo(state.bullet.x, state.bullet.y);
      ctx.lineTo(state.bullet.x + 34, state.bullet.y);
      ctx.stroke();
      ctx.restore();
    }

    for (const p of state.particles) {
      ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawLightning() {
    const L = state.lightning;
    if (!L || !L.active) return;
    const t = Math.max(0, L.life / L.maxLife);
    ctx.save();
    ctx.shadowColor = '#cfe8ff';
    ctx.shadowBlur = 32;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    L.segments.forEach(seg => {
      const pts = seg.points;
      if (pts.length < 2) return;

      ctx.strokeStyle = 'rgba(150,200,255,' + (0.38 * t) + ')';
      ctx.lineWidth = seg.width * 3.6;
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
      ctx.stroke();

      ctx.strokeStyle = 'rgba(215,238,255,' + (0.92 * t) + ')';
      ctx.lineWidth = seg.width;
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
      ctx.stroke();

      ctx.strokeStyle = 'rgba(255,255,255,' + t + ')';
      ctx.lineWidth = seg.width * 0.42;
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
      ctx.stroke();
    });
    ctx.restore();
  }

  function drawFlash() {
    const L = state.lightning;
    if (L && L.flash > 0) {
      ctx.save();
      ctx.fillStyle = 'rgba(200,230,255,' + (L.flash * 0.4) + ')';
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }
    if (state.timeUpFlash > 0) {
      ctx.save();
      ctx.fillStyle = 'rgba(255,80,80,' + (state.timeUpFlash * 0.28) + ')';
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }
  }

  function drawTimer() {
    if (state.phase !== 'ask') return;
    const t = state.timeLeft;
    const ratio = Math.max(0, t / TIME_LIMIT);

    const bw = 360;
    const bh = 46;
    const bx = (W - bw) / 2;
    const by = 18;

    ctx.save();
    ctx.fillStyle = 'rgba(8,12,20,0.82)';
    rr(bx, by, bw, bh, 23); ctx.fill();

    const borderColor = ratio < 0.3 ? 'rgba(255,90,90,0.95)' : 'rgba(95,208,255,0.65)';
    ctx.strokeStyle = borderColor;
    ctx.lineWidth = 2.5;
    rr(bx, by, bw, bh, 23); ctx.stroke();

    const px = bx + 6;
    const py = by + 6;
    const pw = (bw - 12) * ratio;
    const ph = bh - 12;

    let c1, c2;
    if (ratio < 0.3) { c1 = '#ff6b6b'; c2 = '#c0392b'; }
    else if (ratio < 0.6) { c1 = '#ffd166'; c2 = '#e67e22'; }
    else { c1 = '#7fe0ff'; c2 = '#35b6e6'; }
    const grad = ctx.createLinearGradient(px, py, px + Math.max(pw, 1), py);
    grad.addColorStop(0, c1);
    grad.addColorStop(1, c2);
    ctx.fillStyle = grad;
    rr(px, py, Math.max(0, pw), ph, 17); ctx.fill();

    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 21px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineWidth = 3;
    ctx.strokeStyle = 'rgba(0,0,0,0.55)';
    const label = Math.ceil(t) + ' 秒';
    ctx.strokeText(label, W / 2, by + bh / 2 + 1);
    ctx.fillText(label, W / 2, by + bh / 2 + 1);

    if (ratio < 0.3) {
      const blink = Math.sin(performance.now() / 100) * 0.4 + 0.6;
      ctx.fillStyle = 'rgba(255,90,90,' + (blink * 0.14) + ')';
      ctx.fillRect(0, 0, W, H);
    }

    ctx.restore();
    ctx.textAlign = 'start';
    ctx.textBaseline = 'alphabetic';
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#0a0c11';
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    if (state.shake > 0) {
      const amt = state.shake * 14;
      ctx.translate((Math.random() - 0.5) * amt, (Math.random() - 0.5) * amt);
    }
    drawBg();
    drawTruck();
    drawRescuedGuards();
    drawHostage();
    drawBubble();
    drawEffects();
    drawLightning();
    ctx.restore();

    drawFlash();
    drawTimer();
  }

  let lastT = performance.now();
  function loop(t) {
    const dt = Math.min((t - lastT) / 1000, 0.05);
    lastT = t;
    if (!paused) update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  function updateHUD() {
    document.getElementById('score').textContent = state.score;
    document.getElementById('rescued').textContent = state.rescued;
    document.getElementById('target').textContent = state.target;
    document.getElementById('groupTag').textContent = GROUPS[currentGroupIndex] ? GROUPS[currentGroupIndex].name : '—';
    const full = Math.max(0, state.lives);
    const empty = Math.max(0, MAX_LIVES - full);
    document.getElementById('lives').textContent = '❤️'.repeat(full) + '🖤'.repeat(empty);
  }

  function endGame(win) {
    state.phase = 'over';
    document.getElementById('options').innerHTML = '';
    const ov = document.getElementById('overlay');
    const title = document.getElementById('ovTitle');
    title.textContent = win ? '任 务 完 成' : '任 务 失 败';
    title.style.color = win ? '#3ddc84' : '#ff5a5a';
    document.getElementById('ovText').innerHTML =
      '成功解救 <b>' + state.rescued + '</b> / ' + state.target + ' 名人质<br>最终得分 <b>' + state.score + '</b>';
    ov.classList.remove('hidden');
  }

  function startGroup(idx) {
    // 防御：如果 idx 越界，回退到 0
    if (!GROUPS[idx]) idx = 0;
    currentGroupIndex = idx;
    wordQueue = [];
    state.score = 0;
    state.lives = MAX_LIVES;
    state.rescued = 0;
    const words = getCurrentWords();
    state.target = Math.max(1, Math.min(10, words.length));
    state.word = null;
    state.particles = [];
    state.muzzle = 0;
    state.lightning = { active: false, life: 0, maxLife: 0, flash: 0, segments: [] };
    state.shake = 0;
    state.timeLeft = TIME_LIMIT;
    state.timeUpFlash = 0;
    state.rescuedGuards = [];
    state.phase = 'enter';
    document.getElementById('overlay').classList.add('hidden');
    paused = false;
    updateHUD();
    nextRound();
  }

  function restart() {
    startGroup(currentGroupIndex);
  }

  function renderMenu() {
    const grid = document.getElementById('groupGrid');
    grid.innerHTML = '';

    // 防御：确保 GROUPS 是非空数组
    if (!Array.isArray(GROUPS) || GROUPS.length === 0) {
      GROUPS = deepClone(DEFAULT_GROUPS);
    }

    GROUPS.forEach((g, i) => {
      const card = document.createElement('button');
      card.className = 'group-card';
      const preview = (g.words || []).slice(0, 12).map(w => w.jp || '？').join(' · ');
      card.innerHTML =
        '<div class="group-name">' + escapeHtml(g.name) + '</div>' +
        '<div class="group-count">共 ' + (g.words ? g.words.length : 0) + ' 个单词</div>' +
        '<div class="group-words">' + escapeHtml(preview) + (g.words && g.words.length > 12 ? ' …' : '') + '</div>';

      card.addEventListener('pointerdown', (e) => {
        if (e.button !== undefined && e.button !== 0) return;
        e.preventDefault();
        closeMenuAndStart(i);
      }, { passive: false });

      card.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          closeMenuAndStart(i);
        }
      });

      grid.appendChild(card);
    });

    console.log('[菜单] 已渲染', GROUPS.length, '张分组卡片');
  }

  let menuAnimating = false;
  function closeMenuAndStart(idx) {
    if (menuAnimating) return;
    menuAnimating = true;
    const menu = document.getElementById('menu');
    menu.classList.add('fade-out');
    setTimeout(() => {
      menu.classList.add('hidden');
      menu.classList.remove('fade-out');
      menuAnimating = false;
      startGroup(idx);
    }, 380);
  }

  function openMenu() {
    paused = true;
    const menu = document.getElementById('menu');
    menu.classList.remove('hidden');
    void menu.offsetWidth;
    menu.classList.remove('fade-out');
    renderMenu();
  }

  /* ============ 词库编辑器 ============ */
  const editorEl = document.getElementById('editor');
  const editorListEl = document.getElementById('editorList');
  const saveBtn = document.getElementById('saveWords');

  function flashSaveButton() {
    saveBtn.classList.add('saved');
    saveBtn.textContent = '✓ 已保存';
    setTimeout(() => {
      saveBtn.classList.remove('saved');
      saveBtn.textContent = '💾 保存词库';
    }, 1400);
  }

  function openEditor() {
    paused = true;
    editorEl.classList.remove('hidden');
    document.getElementById('editGroupName').textContent = GROUPS[currentGroupIndex] ? GROUPS[currentGroupIndex].name : '—';
    renderEditor();
  }

  function closeEditor() {
    editorEl.classList.add('hidden');
    startGroup(currentGroupIndex);
  }

  function saveEditor() {
    const result = saveToStorage();
    if (result.ok && result.mode === 'local') {
      flashSaveButton();
      showToast('✓ 词库已保存到浏览器', false);
    } else if (result.ok && result.mode === 'session') {
      flashSaveButton();
      showToast('✓ 词库已保存（临时会话）', false,
        '浏览器限制了永久存储，刷新后可能丢失，建议用「导出文件」备份');
    } else {
      flashSaveButton();
      showToast('⚠ 已存入内存（本次有效）', true,
        '浏览器完全禁用了存储，请用「导出文件」保存到本地');
    }
  }

  function exportWords() {
    try {
      const dataStr = JSON.stringify(GROUPS, null, 2);
      const blob = new Blob([dataStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = '单词救援词库_' + new Date().toISOString().slice(0, 10) + '.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      showToast('✓ 已导出文件', false, '请妥善保存该 JSON 文件');
    } catch (e) {
      showToast('✗ 导出失败', true, String(e.message || e));
    }
  }

  function importWords(file) {
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const parsed = JSON.parse(ev.target.result);
        GROUPS = normalizeGroups(parsed);
        saveToStorage();
        renderMenu();
        document.getElementById('editGroupName').textContent = GROUPS[currentGroupIndex] ? GROUPS[currentGroupIndex].name : '—';
        renderEditor();
        showToast('✓ 导入成功', false, '共 ' + GROUPS.length + ' 组词库');
      } catch (e) {
        showToast('✗ 导入失败', true, '文件格式不正确');
      }
    };
    reader.onerror = () => showToast('✗ 读取文件失败', true);
    reader.readAsText(file);
  }

  function renderEditor() {
    const group = GROUPS[currentGroupIndex];
    if (!group) {
      editorListEl.innerHTML = '<div style="color:#7f93a8;text-align:center;padding:60px 20px;">分组不存在</div>';
      return;
    }
    const words = group.words;
    editorListEl.innerHTML = '';

    if (words.length === 0) {
      const empty = document.createElement('div');
      empty.style.cssText = 'color:#7f93a8;text-align:center;padding:60px 20px;font-size:15px;';
      empty.textContent = '本组词库是空的，点击上方「+ 添加新单词」来创建。';
      editorListEl.appendChild(empty);
      return;
    }

    words.forEach((w, wi) => {
      const card = document.createElement('div');
      card.className = 'word-card';

      const head = document.createElement('div');
      head.className = 'word-head';

      const lbl = document.createElement('span');
      lbl.className = 'word-label';
      lbl.textContent = '原形';

      const jpInput = document.createElement('input');
      jpInput.className = 'word-jp';
      jpInput.type = 'text';
      jpInput.value = w.jp;
      jpInput.placeholder = '例如：答える';
      jpInput.addEventListener('input', () => {
        w.jp = jpInput.value;
      });

      const delWordBtn = document.createElement('button');
      delWordBtn.className = 'btn-del-word';
      delWordBtn.textContent = '删除单词';
      delWordBtn.addEventListener('click', () => {
        if (confirm('确定删除「' + (w.jp || '未命名') + '」吗？')) {
          group.words.splice(wi, 1);
          renderEditor();
        }
      });

      head.appendChild(lbl);
      head.appendChild(jpInput);
      head.appendChild(delWordBtn);
      card.appendChild(head);

      const optList = document.createElement('div');
      optList.className = 'opt-list';

      w.options.forEach((opt, oi) => {
        const row = document.createElement('div');
        row.className = 'opt-row' + (opt.correct ? ' is-correct' : '');

        const txt = document.createElement('input');
        txt.className = 'opt-text';
        txt.type = 'text';
        txt.value = opt.text;
        txt.placeholder = '选项内容';
        txt.addEventListener('input', () => {
          opt.text = txt.value;
        });

        const markBtn = document.createElement('button');
        markBtn.className = 'btn-mark-correct';
        markBtn.textContent = opt.correct ? '✓ 正确' : '标为正确';
        markBtn.addEventListener('click', () => {
          w.options.forEach(o => o.correct = false);
          opt.correct = true;
          renderEditor();
        });

        const delOptBtn = document.createElement('button');
        delOptBtn.className = 'btn-del-opt';
        delOptBtn.textContent = '×';
        delOptBtn.title = w.options.length <= 2 ? '至少保留 2 个选项' : '删除此选项';
        delOptBtn.disabled = w.options.length <= 2;
        delOptBtn.addEventListener('click', () => {
          if (w.options.length <= 2) return;
          w.options.splice(oi, 1);
          if (!w.options.some(o => o.correct)) w.options[0].correct = true;
          renderEditor();
        });

        row.appendChild(txt);
        row.appendChild(markBtn);
        row.appendChild(delOptBtn);
        optList.appendChild(row);
      });

      card.appendChild(optList);

      const addOptBtn = document.createElement('button');
      addOptBtn.className = 'btn-add-opt';
      addOptBtn.textContent = '+ 添加选项';
      addOptBtn.addEventListener('click', () => {
        w.options.push({ text:'', correct:false });
        renderEditor();
        requestAnimationFrame(() => {
          const cards = editorListEl.querySelectorAll('.word-card');
          const targetCard = cards[wi];
          if (!targetCard) return;
          const inputs = targetCard.querySelectorAll('.opt-text');
          const last = inputs[inputs.length - 1];
          if (last) { last.focus(); last.scrollIntoView({ block:'nearest' }); }
        });
      });
      card.appendChild(addOptBtn);

      editorListEl.appendChild(card);
    });
  }

  /* ============ 事件绑定 ============ */
  document.getElementById('restart').addEventListener('click', restart);
  document.getElementById('toMenu').addEventListener('click', () => {
    document.getElementById('overlay').classList.add('hidden');
    openMenu();
  });
  document.getElementById('btnMenu').addEventListener('click', openMenu);
  document.getElementById('btnEditor').addEventListener('click', openEditor);
  document.getElementById('closeEditor').addEventListener('click', closeEditor);
  saveBtn.addEventListener('click', saveEditor);

  document.getElementById('addWord').addEventListener('click', () => {
    const group = GROUPS[currentGroupIndex];
    if (!group) return;
    group.words.push({
      jp: '',
      options: [
        { text:'', correct:true  },
        { text:'', correct:false },
        { text:'', correct:false },
        { text:'', correct:false }
      ]
    });
    renderEditor();
    requestAnimationFrame(() => {
      const cards = editorListEl.querySelectorAll('.word-card');
      const last = cards[cards.length - 1];
      if (last) {
        last.scrollIntoView({ block:'center', behavior:'smooth' });
        const jp = last.querySelector('.word-jp');
        if (jp) jp.focus();
      }
    });
  });

  document.getElementById('resetWords').addEventListener('click', () => {
    if (confirm('确定恢复所有分组的默认词库吗？当前修改将丢失。')) {
      GROUPS = deepClone(DEFAULT_GROUPS);
      renderMenu();
      document.getElementById('editGroupName').textContent = GROUPS[currentGroupIndex] ? GROUPS[currentGroupIndex].name : '—';
      renderEditor();
    }
  });

  document.getElementById('exportWords').addEventListener('click', exportWords);
  document.getElementById('importWords').addEventListener('click', () => {
    document.getElementById('importFile').click();
  });
  document.getElementById('importFile').addEventListener('change', (e) => {
    const file = e.target.files && e.target.files[0];
    if (file) importWords(file);
    e.target.value = '';
  });

  window.addEventListener('beforeunload', () => {
    if (!editorEl.classList.contains('hidden')) {
      saveToStorage();
    }
  });

  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });

  /* ============ 启动 ============ */
  try {
    loadFromStorage();
  } catch (e) {
    console.error('[启动] 加载词库失败，使用默认数据', e);
    GROUPS = deepClone(DEFAULT_GROUPS);
  }

  // 二次兜底：确保 GROUPS 一定是非空数组
  if (!Array.isArray(GROUPS) || GROUPS.length === 0) {
    GROUPS = deepClone(DEFAULT_GROUPS);
  }

  updateHUD();
  renderMenu();
  openMenu();
  requestAnimationFrame(loop);

  console.log('[启动完成] GROUPS.length =', GROUPS.length, '| 当前组 =', currentGroupIndex);

})();
</script>
</body>
</html>
