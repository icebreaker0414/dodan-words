<!DOCTYPE html>

<style>

  .group-card:nth-child(1) { animation: cardFadeIn 0.75s cubic-bezier(0.22, 1, 0.36, 1) 0.15s forwards; }
  .group-card:nth-child(2) { animation: cardFadeIn 0.75s cubic-bezier(0.22, 1, 0.36, 1) 0.28s forwards; }
  .group-card:nth-child(3) { animation: cardFadeIn 0.75s cubic-bezier(0.22, 1, 0.36, 1) 0.41s forwards; }

  .group-card:active { transform: translateY(-1px) scale(0.985); }
  .group-card::after { content: ''; position: absolute; top: 0; left: -60%; width: 50%; height: 100%; background: linear-gradient(100deg, rgba(255,255,255,0) 0%, rgba(143,214,255,0.16) 50%, rgba(255,255,255,0) 100%); transform: skewX(-18deg); pointer-events: none; transition: left 0.7s ease; }
  .group-card:hover::after, .group-card:active::after { left: 130%; }
  .group-card::before { content: ''; position: absolute; top: 16px; right: 18px; width: 8px; height: 8px; border-radius: 50%; background: #3ddc84; box-shadow: 0 0 12px #3ddc84; animation: dotPulse 2.2s ease-in-out infinite; }
  @keyframes dotPulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.55; transform: scale(0.75); } }

  @keyframes shineText { to { background-position: 200% center; } }
  .group-count { font-size: 12px; color: #5f7286; letter-spacing: 1px; }
  .group-words { font-size: 13px; line-height: 1.9; color: #9fb2c6; letter-spacing: .5px; word-break: break-all; }
  #editor { position: fixed; inset: 0; background: rgba(5,8,12,0.97); z-index: 1000; display: flex; flex-direction: column; padding: 16px; animation: overlayIn 0.3s ease; }

  .editor-header { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 4px 6px 14px; border-bottom: 1px solid #2b3646; flex-wrap: wrap; }

  .editor-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  #editorList { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 16px 6px 40px; display: flex; flex-direction: column; gap: 14px; max-width: 900px; width: 100%; margin: 0 auto; }
  .word-card { background: linear-gradient(#1b212c, #141920); border: 1px solid #2f3a4b; border-radius: 12px; padding: 14px 16px; flex: 0 0 auto; }

  .btn-del-word:hover { background: #4a1a1a; border-color: #ff5050; }
  .btn-del-word:active { transform: scale(0.95); }

</style>
</head>
<body>

<div id="menu">
  <h1 class="menu-title">把动词转换为第二连用形</h1>
  <p class="menu-sub">选择一组单词，救出人质 —— 选出正确的 <b>第二连用形</b></p>
  <div class="group-grid" id="groupGrid"></div>
</div>

<div id="wrap">
  <div class="hud">
    <div>
      <span id="groupTag">第一组</span>
      &nbsp;已解救：<b id="rescued">0</b> / <b id="target">10</b>
    </div>
    <div class="hud-right">
      <button id="btnEditor" class="mini-btn">✎ 编辑本组词库</button>
      <button id="btnMenu" class="mini-btn">☰ 选择分组</button>
    </div>
  </div>

  <div class="stage">
    <canvas id="cv" width="900" height="520"></canvas>
    <div id="overlay" class="hidden">
      <h2 id="ovTitle">任务失败</h2>
      <p id="ovText"></p>
      <div class="ov-btns">
        <button id="restart" class="btn-primary">再来一次</button>
        <button id="toMenu" class="btn-ghost">返回选组</button>
      </div>
    </div>
  </div>

  <div id="options"></div>
  <div class="tip">人质头顶是动词「原形」，请在 <b>10 秒内</b> 选出它的「第二连用形」；答错或超时该名人质会被击毙，但游戏继续，最后统计救出人数。</div>
</div>

<div id="editor" class="hidden">
  <div class="editor-header">
    <h2>词库编辑 · <span id="editGroupName">第一组</span></h2>
    <div class="editor-actions">
      <button id="addWord" class="btn-primary">+ 添加新单词</button>
      <button id="resetWords" class="btn-ghost">恢复本组默认</button>
      <button id="closeEditor" class="btn-primary">完成并保存</button>
    </div>
  </div>
  <div id="editorList"></div>
  <div class="editor-hint">每个单词至少需要 2 个选项。点击「标为正确」切换正确答案。点击「完成并保存」后写入浏览器本地存储。</div>
</div>

  /* ============ 基础 ============ */
  const cv = document.getElementById('cv');

  const W = cv.width, H = cv.height;

  /* ==========================================================
     存储适配器
     ========================================================== */
  const Storage = (function () {
    let available = false;
    const memoryStore = {};
    try {
      const testKey = '__storage_test__';
      localStorage.setItem(testKey, '1');
      localStorage.removeItem(testKey);
      available = true;
    } catch (e) {
      available = false;
      console.warn('[Storage] localStorage 不可用，降级到内存存储：', e.name);
    }
    return {
      isAvailable: () => available,
      getItem(key) {
        if (available) {
          try { return localStorage.getItem(key); }
          catch (e) { return memoryStore[key] !== undefined ? memoryStore[key] : null; }
        }
        return memoryStore[key] !== undefined ? memoryStore[key] : null;
      },
      setItem(key, value) {
        if (available) {
          try {
            localStorage.setItem(key, value);
            return { ok: true };
          } catch (e) {
            available = false;
            memoryStore[key] = value;
            return { ok: false, reason: e.name, memoryOnly: true };
          }
        }
        memoryStore[key] = value;
        return { ok: true, memoryOnly: true };
      }
    };
  })();

  /* ==========================================================
     BGM 合成器（Web Audio API）
     ========================================================== */
  const BGM = (function () {
    let ctxAudio = null;
    let masterGain = null;
    let happyTimer = null;
    let sadTimer = null;
    let currentMode = null;   // 'happy' | 'sad' | null
    let started = false;

    function ensureCtx() {
      if (ctxAudio) return true;
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return false;
        ctxAudio = new AC();
        masterGain = ctxAudio.createGain();
        masterGain.gain.value = 0.22;
        masterGain.connect(ctxAudio.destination);
        return true;
      } catch (e) {
        console.warn('[BGM] AudioContext 创建失败：', e);
        return false;
      }
    }

    // 播放单个音符
    function playNote(freq, startTime, duration, type, volume) {
      if (!ctxAudio) return;
      const osc = ctxAudio.createOscillator();
      const gain = ctxAudio.createGain();
      osc.type = type || 'sine';
      osc.frequency.value = freq;
      const v = volume == null ? 0.5 : volume;
      const t0 = startTime;
      const t1 = t0 + duration;
      gain.gain.setValueAtTime(0, t0);
      gain.gain.linearRampToValueAtTime(v, t0 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, t1);
      osc.connect(gain);
      gain.connect(masterGain);
      osc.start(t0);
      osc.stop(t1 + 0.05);
    }

    // 音符名 → 频率
    const NOTE_FREQ = {
      'C4': 261.63, 'D4': 293.66, 'E4': 329.63, 'F4': 349.23,
      'G4': 392.00, 'A4': 440.00, 'B4': 493.88,
      'C5': 523.25, 'D5': 587.33, 'E5': 659.25, 'F5': 698.46,
      'G5': 783.99, 'A5': 880.00, 'B5': 987.77, 'C6': 1046.50,
      'A3': 220.00, 'B3': 246.94, 'G3': 196.00, 'F3': 174.61,
      'E3': 164.81, 'D3': 146.83, 'C3': 130.81,
      'R': 0  // 休止符
    };

    // 欢快旋律：C大调，轻快跳跃
    const HAPPY_MELODY = [
      ['E5', 0.20], ['G5', 0.20], ['C6', 0.20], ['B5', 0.20],
      ['A5', 0.20], ['G5', 0.20], ['E5', 0.40], ['R', 0.20],
      ['D5', 0.20], ['E5', 0.20], ['G5', 0.20], ['E5', 0.20],
      ['C5', 0.20], ['D5', 0.20], ['E5', 0.40], ['R', 0.20],
      ['G4', 0.20], ['A4', 0.20], ['C5', 0.20], ['D5', 0.20],
      ['E5', 0.20], ['D5', 0.20], ['C5', 0.40], ['R', 0.30],
      ['E5', 0.20], ['G5', 0.20], ['A5', 0.20], ['G5', 0.20],
      ['E5', 0.20], ['C5', 0.20], ['D5', 0.20], ['C5', 0.60]
    ];
    // 欢快低音（简单和弦分解）
    const HAPPY_BASS = [
      ['C3', 0.40], ['G3', 0.40], ['C3', 0.40], ['E3', 0.40],
      ['D3', 0.40], ['A3', 0.40], ['D3', 0.40], ['F3', 0.40],
      ['C3', 0.40], ['G3', 0.40], ['C3', 0.40], ['E3', 0.40],
      ['G3', 0.40], ['D3', 0.40], ['C3', 0.80]
    ];

    // 悲伤旋律：A小调，下行
    const SAD_MELODY = [
      ['A5', 0.45], ['G5', 0.45], ['F5', 0.45], ['E5', 0.60],
      ['D5', 0.45], ['C5', 0.45], ['B4', 0.60], ['A4', 0.90],
      ['E5', 0.45], ['D5', 0.45], ['C5', 0.45], ['B4', 0.60],
      ['A4', 0.80], ['R', 0.40]
    ];
    const SAD_BASS = [
      ['A3', 0.90], ['F3', 0.90], ['D3', 0.90], ['E3', 1.20],
      ['A3', 0.90], ['F3', 0.90], ['E3', 0.90], ['A3', 1.20]
    ];

    function scheduleMelody(melody, bass, loop) {
      if (!ctxAudio) return;
      const t0 = ctxAudio.currentTime + 0.05;

      // 主旋律
      let t = t0;
      melody.forEach(([note, dur]) => {
        if (note !== 'R') {
          playNote(NOTE_FREQ[note], t, dur * 0.95, 'triangle', 0.42);
        }
        t += dur;
      });
      const melodyDur = t - t0;

      // 低音
      let tb = t0;
      bass.forEach(([note, dur]) => {
        if (note !== 'R') {
          playNote(NOTE_FREQ[note], tb, dur * 0.95, 'sine', 0.30);
        }
        tb += dur;
      });

      const total = Math.max(melodyDur, tb - t0);
      return total;
    }

    function loopHappy() {
      if (currentMode !== 'happy' || !ctxAudio) return;
      const dur = scheduleMelody(HAPPY_MELODY, HAPPY_BASS, true);
      happyTimer = setTimeout(loopHappy, dur * 1000);
    }
    function loopSad() {
      if (currentMode !== 'sad' || !ctxAudio) return;
      const dur = scheduleMelody(SAD_MELODY, SAD_BASS, true);
      sadTimer = setTimeout(loopSad, dur * 1000);
    }

    function stopAll() {
      if (happyTimer) { clearTimeout(happyTimer); happyTimer = null; }
      if (sadTimer) { clearTimeout(sadTimer); sadTimer = null; }
      currentMode = null;
    }

    return {
      // 首次用户交互时调用
      init() {
        if (started) return;
        started = ensureCtx();
        if (started && ctxAudio.state === 'suspended') {
          ctxAudio.resume().catch(() => {});
        }
      },
      // 播放欢快 BGM
      playHappy() {
        if (!ensureCtx()) return;
        if (ctxAudio.state === 'suspended') ctxAudio.resume().catch(() => {});
        stopAll();
        currentMode = 'happy';
        loopHappy();
      },
      // 播放悲伤 BGM（指定时长后自动停止）
      playSad(durationMs) {
        if (!ensureCtx()) return;
        if (ctxAudio.state === 'suspended') ctxAudio.resume().catch(() => {});
        stopAll();
        currentMode = 'sad';
        loopSad();
        // 到点后停止悲伤
        setTimeout(() => {
          if (currentMode === 'sad') {
            stopAll();
          }
        }, durationMs || 3000);
      },
      stop() {
        stopAll();
      },
      isHappyPlaying() {
        return currentMode === 'happy';
      }
    };
  })();

  /* ============ 数据读写 ============ */
  let GROUPS = loadGroupsFromStorage();

  function normalizeGroups(raw) {
    if (!Array.isArray(raw) || raw.length === 0) return JSON.parse(JSON.stringify(DEFAULT_GROUPS));
    return raw.map(g => ({
      name: String(g.name || '未命名组'),
      words: Array.isArray(g.words) ? g.words.map(normalizeWord) : []
    }));
  }
  function normalizeWord(w) {
    const item = { jp: String(w.jp || ''), options: [] };
    const opts = Array.isArray(w.options) ? w.options : [];
    opts.forEach(o => item.options.push({ text: String(o.text != null ? o.text : ''), correct: !!o.correct }));
    if (item.options.length === 0) item.options.push({ text:'', correct:true });
    let seen = false;
    item.options.forEach(o => { if (o.correct) { if (seen) o.correct = false; else seen = true; } });
    if (!seen) item.options[0].correct = true;
    return item;
  }
  function loadGroupsFromStorage() {
    try {
      const raw = Storage.getItem(STORAGE_KEY);
      if (raw) return normalizeGroups(JSON.parse(raw));
    } catch (e) { }
    return JSON.parse(JSON.stringify(DEFAULT_GROUPS));
  }
  function saveGroupsToStorage() {
    return Storage.setItem(STORAGE_KEY, JSON.stringify(GROUPS));
  }

  /* ============ Toast ============ */
  function showToast(msg, isError) {
    let toast = document.getElementById('appToast');
    if (!toast) {
      toast = document.createElement('div');
      toast.id = 'appToast';
      toast.style.cssText = `
        position: fixed; left: 50%; top: 28px; transform: translateX(-50%) translateY(-10px);
        background: rgba(20,30,40,0.96); color: #8fd6ff;

        z-index: 2000; box-shadow: 0 0 24px rgba(95,208,255,.5);
        opacity: 0; pointer-events: none;
        transition: opacity .25s ease, transform .25s ease;
        font-family: inherit; max-width: 90vw; text-align: center;
      `;
      document.body.appendChild(toast);
    }
    toast.textContent = msg;
    toast.style.color = isError ? '#ff8a8a' : '#8fd6ff';
    toast.style.borderColor = isError ? '#ff5050' : '#5fd0ff';
    toast.style.boxShadow = isError ? '0 0 24px rgba(255,80,80,.5)' : '0 0 24px rgba(95,208,255,.5)';
    requestAnimationFrame(() => {
      toast.style.opacity = '1';
      toast.style.transform = 'translateX(-50%) translateY(0)';
    });
    clearTimeout(toast._t);
    toast._t = setTimeout(() => {
      toast.style.opacity = '0';
      toast.style.transform = 'translateX(-50%) translateY(-10px)';
    }, 2200);
  }

  /* ============ 当前分组 ============ */
  let currentGroupIndex = 0;
  let WORDS = [];
  let wordQueue = [];
  let paused = true;

  /* ============ 状态 ============ */
  const state = {
    phase: 'idle',   // idle | enter | ask | rescue | jump | shoot | dying | wait | over
    timer: 0,
    rescued: 0,
    answered: 0,
    totalRounds: 10,
    word: null, options: [], buttons: [], hostage: null,
    bullet: { active: false, x: 0, y: 0, vx: 0, targetX: 0 },
    particles: [], muzzle: 0,
    lightning: { active: false, life: 0, maxLife: 0, flash: 0, segments: [] },
    shake: 0, timeLeft: TIME_LIMIT, timeUpFlash: 0,
    rescuedGuards: [],   // {phase, x, y, vy, bounce, scale}
    jump: null,          // 人质跳进车的动画 {startX, startY, t, duration}
    readyToStart: false  // 进入准备界面后为 true
  };

  /* ============ 工具 ============ */
  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  /* ============ 探照灯 ============ */
  const LAMP = { minX: 700, maxX: 900, y: 60, headW: 32, headH: 24, period: 5200 };
  function getLampX() {
    const phase = (performance.now() % LAMP.period) / LAMP.period;
    const tri = phase < 0.5 ? phase * 2 : 2 - phase * 2;
    return LAMP.minX + (LAMP.maxX - LAMP.minX) * tri;
  }

  /* ============ 关卡 ============ */
  function drawWord() {
    if (WORDS.length === 0) return null;
    if (wordQueue.length === 0) wordQueue = shuffle(WORDS.slice());
    return wordQueue.pop();
  }

  function nextRound() {
    if (state.answered >= state.totalRounds) { endGame(); return; }
    const word = drawWord();
    if (!word) { endGame(); return; }
    state.word = word;
    state.options = shuffle(word.options.map(o => ({ text: o.text, correct: o.correct })));

    state.hostage = { x: 720, y: GROUND, stopX: 420, alpha: 1, walkPhase: 0, fall: 0, dead: false };
    state.bullet = { active: false, x: 0, y: 0, vx: 0, targetX: 0 };
    state.particles = [];
    state.muzzle = 0;
    state.lightning = { active: false, life: 0, maxLife: 0, flash: 0, segments: [] };
    state.shake = 0;
    state.timeLeft = TIME_LIMIT;
    state.timeUpFlash = 0;
    state.jump = null;
    state.phase = 'enter';

    renderOptions();
  }

  /* ============ 选项 UI ============ */
  const LETTERS = ['A','B','C','D','E','F','G','H','I','J'];
  function renderOptions() {
    const el = document.getElementById('options');
    el.innerHTML = '';
    state.buttons = [];
    state.options.forEach((opt, i) => {
      const b = document.createElement('button');
      b.className = 'opt';
      b.disabled = true;
      b.innerHTML = '<span class="key">' + (LETTERS[i] || '?') + '</span><span class="txt">' + escapeHtml(opt.text) + '</span>';
      b.addEventListener('pointerdown', (e) => {
        if (e.button !== undefined && e.button !== 0) return;
        e.preventDefault();
        answer(i, b);
      }, { passive: false });
      el.appendChild(b);
      state.buttons.push(b);
    });
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  }
  function setButtonsEnabled(v) {
    state.buttons.forEach(b => {
      if (b.classList.contains('correct') || b.classList.contains('wrong')) return;
      b.disabled = !v;
    });
  }

  /* ============ 作答 ============ */
  function answer(i, btn) {
    if (state.phase !== 'ask') return;
    const chosen = state.options[i];
    const isCorrect = chosen.correct;
    const correctIndex = state.options.findIndex(o => o.correct);

    state.buttons.forEach(b => b.disabled = true);
    if (correctIndex >= 0) state.buttons[correctIndex].classList.add('correct');

    state.answered += 1;
    if (isCorrect) {
      state.rescued += 1;
      updateHUD();
      state.phase = 'rescue';
    } else {
      btn.classList.add('wrong');
      // 悲伤 BGM 3 秒
      BGM.playSad(3000);
      triggerShoot();
    }
  }

  function triggerShoot() {
    state.phase = 'shoot';
    const h = state.hostage;
    state.bullet = { active: true, x: W - 30, y: h.y - 68, vx: -1700, targetX: h.x + 6 };
    state.muzzle = 0.18;
  }

  function timeUp() {
    if (state.phase !== 'ask') return;
    const correctIndex = state.options.findIndex(o => o.correct);
    state.buttons.forEach(b => b.disabled = true);
    if (correctIndex >= 0) state.buttons[correctIndex].classList.add('correct');
    state.timeUpFlash = 1;
    state.answered += 1;
    BGM.playSad(3000);
    triggerShoot();
  }

  /* ============ 闪电 ============ */
  function generateLightningSegments(targetX, targetY) {
    const segments = [];
    const startX = targetX + (Math.random() - 0.5) * 80;
    const startY = -20;
    const endX = targetX;
    const endY = targetY;
    const steps = 14;
    const main = [];
    for (let i = 0; i <= steps; i++) {
      const t = i / steps;
      const jitterX = (i === 0 || i === steps) ? 0 : (Math.random() - 0.5) * 55 * (1 - t * 0.3);
      const jitterY = (i === 0 || i === steps) ? 0 : (Math.random() - 0.5) * 10;
      main.push({ x: startX + (endX - startX) * t + jitterX, y: startY + (endY - startY) * t + jitterY });
    }
    segments.push({ points: main, width: 3.6 });
    const branchCount = 3 + Math.floor(Math.random() * 3);
    for (let b = 0; b < branchCount; b++) {
      const startIdx = 3 + Math.floor(Math.random() * (steps - 6));
      const anchor = main[startIdx];
      const dir = Math.random() < 0.5 ? -1 : 1;
      const branch = [{ x: anchor.x, y: anchor.y }];
      let bx = anchor.x, by = anchor.y;
      const len = 4 + Math.floor(Math.random() * 3);
      for (let i = 0; i < len; i++) {
        bx += dir * (8 + Math.random() * 16) + (Math.random() - 0.5) * 12;
        by += 10 + Math.random() * 16;
        branch.push({ x: bx, y: by });
      }
      segments.push({ points: branch, width: 1.8 });
    }
    return segments;
  }

  function hitHostage() {
    const h = state.hostage;
    for (let i = 0; i < 30; i++) {
      const life = 0.5 + Math.random() * 0.6;
      state.particles.push({
        x: h.x + 4, y: h.y - 68,
        vx: (Math.random() - 0.5) * 430,
        vy: (Math.random() - 1.0) * 380,
        r: 2 + Math.random() * 4,
        color: Math.random() < 0.7 ? '#c0392b' : '#ff6b5b',
        life: life, maxLife: life
      });
    }
    h.dead = true;
    state.phase = 'dying';
    state.lightning = {
      active: true, life: 0.6, maxLife: 0.6, flash: 1.0,
      segments: generateLightningSegments(h.x, h.y - 80)
    };
    state.shake = 0.45;
  }

  /* ============ 更新 ============ */
  function update(dt) {
    for (const p of state.particles) {
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 900 * dt; p.life -= dt;
    }
    state.particles = state.particles.filter(p => p.life > 0);

    if (state.muzzle > 0) state.muzzle -= dt;
    if (state.timeUpFlash > 0) state.timeUpFlash = Math.max(0, state.timeUpFlash - dt * 2.5);

    const L = state.lightning;
    if (L && L.active) {
      L.life -= dt;
      L.flash = Math.max(0, L.flash - dt * 3.2);
      if (L.life <= 0) L.active = false;
    }
    if (state.shake > 0) state.shake = Math.max(0, state.shake - dt * 1.5);

    // 已救出的小人在车里跳动
    for (const g of state.rescuedGuards) {
      g.bounce = (g.bounce || 0) + dt * 6;
    }

    if (state.phase === 'over' || state.phase === 'idle') return;
    const h = state.hostage;
    if (!h) return;

    if (state.phase === 'ask') {
      state.timeLeft -= dt;
      if (state.timeLeft <= 0) { state.timeLeft = 0; timeUp(); return; }
    }

    switch (state.phase) {
      case 'enter':
        h.x -= 320 * dt;
        h.walkPhase += dt * 13;
        if (h.x <= h.stopX) {
          h.x = h.stopX; h.walkPhase = 0;
          state.phase = 'ask';
          state.timeLeft = TIME_LIMIT;
          setButtonsEnabled(true);
        }
        break;
      case 'ask':
        h.walkPhase = 0;
        break;
      case 'rescue': {
        // 走向卡车车厢门口
        const targetX = RESCUE_TARGET_X;
        if (h.x > targetX) {
          h.x -= 260 * dt;
          h.walkPhase += dt * 13;
        } else {
          // 到车边 → 起跳
          h.x = targetX;
          h.walkPhase = 0;
          state.jump = {
            startX: h.x,
            startY: h.y,
            t: 0,
            duration: 0.55
          };
          state.phase = 'jump';
        }
        break;
      }
      case 'jump': {
        // 抛物跳跃：从地面跳到车厢内
        const j = state.jump;
        if (!j) { state.phase = 'wait'; state.timer = 0.4; break; }
        j.t += dt;
        const t = Math.min(1, j.t / j.duration);
        // 目标点：车厢内
        const endX = CARGO_CENTER + (Math.random() - 0.5) * 30;
        const endY = GROUND - 80;  // 车厢内的地平面
        h.x = j.startX + (endX - j.startX) * t;
        // 抛物线：先上后下
        const baseY = j.startY + (endY - j.startY) * t;
        h.y = baseY - Math.sin(t * Math.PI) * 90;
        h.alpha = 1;
        if (t >= 1) {
          h.x = endX;
          h.y = endY;
          h.alpha = 0;  // 进入车厢后消失
          // 加入车内小人
          state.rescuedGuards.push({
            phase: Math.random() * Math.PI * 2,
            bounce: 0
          });
          state.jump = null;
          state.phase = 'wait';
          state.timer = 0.5;
        }
        break;
      }
      case 'shoot': {
        const b = state.bullet;
        if (b.active) {
          b.x += b.vx * dt;
          if (b.x <= b.targetX) { b.active = false; hitHostage(); }
        }
        break;
      }
      case 'dying':
        h.fall = Math.min(1, h.fall + dt * 3.4);
        if (h.fall >= 1) {
          state.phase = 'wait';
          state.timer = 1.2;
        }
        break;
      case 'wait':
        state.timer -= dt;
        if (state.timer <= 0) {
          // 如果悲伤还在放，等它结束再切回欢快（最多等 3 秒）
          nextRound();
          if (!BGM.isHappyPlaying()) {
            BGM.playHappy();
          }
        }
        break;
    }
  }

  /* ============ 绘制：真实月亮 ============ */
  function drawMoon(cx, cy, r) {
    ctx.save();
    const halo = ctx.createRadialGradient(cx, cy, r * 0.9, cx, cy, r * 3.2);
    halo.addColorStop(0, 'rgba(220,235,255,0.16)');
    halo.addColorStop(0.4, 'rgba(200,220,250,0.07)');
    halo.addColorStop(1, 'rgba(200,220,250,0)');
    ctx.fillStyle = halo;
    ctx.beginPath(); ctx.arc(cx, cy, r * 3.2, 0, Math.PI * 2); ctx.fill();

    const body = ctx.createRadialGradient(cx - r * 0.35, cy - r * 0.35, r * 0.15, cx, cy, r);
    body.addColorStop(0, '#fbfcff');
    body.addColorStop(0.45, '#e6ecf5');
    body.addColorStop(0.8, '#c2cbda');
    body.addColorStop(1, '#98a3b5');
    ctx.fillStyle = body;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();

    ctx.save();
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.clip();
    const maria = [
      { x: -0.30, y: -0.15, rr: 0.32, a: 0.10 },
      { x: 0.25, y: 0.28, rr: 0.26, a: 0.09 },
      { x: 0.10, y: -0.42, rr: 0.20, a: 0.08 },
      { x: -0.42, y: 0.30, rr: 0.18, a: 0.07 },
      { x: 0.40, y: -0.18, rr: 0.16, a: 0.07 }
    ];
    maria.forEach(m => {
      const g = ctx.createRadialGradient(cx + m.x * r, cy + m.y * r, 0, cx + m.x * r, cy + m.y * r, m.rr * r);
      g.addColorStop(0, 'rgba(120,135,160,' + m.a + ')');
      g.addColorStop(1, 'rgba(120,135,160,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(cx + m.x * r, cy + m.y * r, m.rr * r, 0, Math.PI * 2); ctx.fill();
    });
    const craters = [
      { x: -0.15, y: 0.10, rr: 0.10, a: 0.14 },
      { x: 0.30, y: -0.10, rr: 0.07, a: 0.12 },
      { x: -0.05, y: -0.30, rr: 0.06, a: 0.11 },
      { x: 0.20, y: 0.42, rr: 0.05, a: 0.10 },
      { x: -0.35, y: -0.35, rr: 0.05, a: 0.10 },
      { x: 0.45, y: 0.10, rr: 0.04, a: 0.09 }
    ];
    craters.forEach(c => {
      const g = ctx.createRadialGradient(cx + c.x * r, cy + c.y * r, 0, cx + c.x * r, cy + c.y * r, c.rr * r);
      g.addColorStop(0, 'rgba(90,105,130,' + c.a + ')');
      g.addColorStop(1, 'rgba(90,105,130,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(cx + c.x * r, cy + c.y * r, c.rr * r, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.16)';
      ctx.lineWidth = Math.max(0.6, r * 0.03);
      ctx.beginPath();
      ctx.arc(cx + c.x * r, cy + c.y * r, c.rr * r * 0.8, Math.PI * 0.9, Math.PI * 1.9);
      ctx.stroke();
    });
    ctx.restore();

    ctx.strokeStyle = 'rgba(200,215,235,0.35)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }

  /* ============ 绘制：背景 ============ */
  function drawBg() {
    const sky = ctx.createLinearGradient(0, 0, 0, GROUND);
    sky.addColorStop(0, '#0b0e15');
    sky.addColorStop(0.55, '#1a2030');
    sky.addColorStop(1, '#2e3648');

    ctx.fillRect(0, 0, W, GROUND);

    drawMoon(140, 88, 26);
    drawSearchlight();

    const gr = ctx.createLinearGradient(0, GROUND, 0, H);
    gr.addColorStop(0, '#3a3429');
    gr.addColorStop(1, '#14110d');
    ctx.fillStyle = gr;
    ctx.fillRect(0, GROUND, W, H - GROUND);

    ctx.strokeStyle = 'rgba(255,255,255,0.09)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, GROUND); ctx.lineTo(W, GROUND); ctx.stroke();

  function drawSearchlight() {
    const lampX = getLampX();
    const lampY = LAMP.y;
    const beamBottomCenter = lampX - 60;
    const beamHalfWidth = 155;

    ctx.save();
    const lg = ctx.createLinearGradient(lampX, lampY, beamBottomCenter, GROUND + 40);
    lg.addColorStop(0, 'rgba(255,245,205,0.32)');
    lg.addColorStop(0.55, 'rgba(255,243,196,0.14)');
    lg.addColorStop(1, 'rgba(255,243,196,0)');
    ctx.fillStyle = lg;
    ctx.beginPath();
    ctx.moveTo(lampX, lampY - 6);
    ctx.lineTo(beamBottomCenter - beamHalfWidth, GROUND + 40);
    ctx.lineTo(beamBottomCenter + beamHalfWidth, GROUND + 40);
    ctx.closePath(); ctx.fill();

    ctx.globalCompositeOperation = 'lighter';
    const lg2 = ctx.createLinearGradient(lampX, lampY, beamBottomCenter, GROUND + 40);
    lg2.addColorStop(0, 'rgba(255,250,220,0.20)');
    lg2.addColorStop(0.6, 'rgba(255,245,200,0.05)');
    lg2.addColorStop(1, 'rgba(255,245,200,0)');
    ctx.fillStyle = lg2;
    ctx.beginPath();
    ctx.moveTo(lampX, lampY - 6);
    ctx.lineTo(beamBottomCenter - beamHalfWidth * 0.55, GROUND + 40);
    ctx.lineTo(beamBottomCenter + beamHalfWidth * 0.55, GROUND + 40);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  function drawCamp() {
    const wallX = 610, wallTop = 132;
    const wg = ctx.createLinearGradient(wallX, 0, W, 0);
    wg.addColorStop(0, '#3c4759');
    wg.addColorStop(1, '#28303e');
    ctx.fillStyle = wg;
    ctx.fillRect(wallX, wallTop, W - wallX, GROUND - wallTop);
    ctx.fillStyle = '#4d5a6d';
    ctx.fillRect(wallX, wallTop, W - wallX, 10);
    ctx.fillStyle = '#333d4d';
    ctx.fillRect(wallX, wallTop + 10, W - wallX, 5);

    ctx.strokeStyle = 'rgba(255,255,255,0.09)';
    ctx.lineWidth = 1;
    let rowIdx = 0;
    for (let y = wallTop + 28; y < GROUND; y += 28) {
      ctx.beginPath(); ctx.moveTo(wallX, y); ctx.lineTo(W, y); ctx.stroke();
      const offset = (rowIdx % 2) * 24;
      for (let x = wallX + offset + 24; x < W; x += 48) {
        ctx.beginPath(); ctx.moveTo(x, y - 28); ctx.lineTo(x, y); ctx.stroke();
      }
      rowIdx++;
    }

    const dx = 660, dw = 112;
    const innerGrad = ctx.createLinearGradient(0, 238, 0, GROUND);
    innerGrad.addColorStop(0, '#1c2331');
    innerGrad.addColorStop(1, '#0f141c');
    ctx.fillStyle = innerGrad;
    ctx.fillRect(dx, 238, dw, GROUND - 238);
    ctx.fillStyle = 'rgba(140,185,225,0.07)';
    ctx.fillRect(dx, 238, dw, GROUND - 238);
    ctx.strokeStyle = 'rgba(190,212,235,0.62)';
    ctx.lineWidth = 2.5;
    for (let x = dx + 12; x < dx + dw - 4; x += 14) {
      ctx.beginPath(); ctx.moveTo(x, 242); ctx.lineTo(x, GROUND - 2); ctx.stroke();
    }
    ctx.strokeStyle = 'rgba(175,198,222,0.55)';
    ctx.lineWidth = 2;
    for (let y = 262; y < GROUND; y += 24) {
      ctx.beginPath(); ctx.moveTo(dx + 2, y); ctx.lineTo(dx + dw - 2, y); ctx.stroke();
    }
    ctx.strokeStyle = '#5e6e82';
    ctx.lineWidth = 5;
    ctx.strokeRect(dx, 238, dw, GROUND - 238);
    ctx.strokeStyle = 'rgba(180,205,230,0.35)';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(dx + 2, 240, dw - 4, GROUND - 240);
    ctx.fillStyle = '#8496ab';
    for (let y = 252; y < GROUND; y += 30) {
      ctx.beginPath(); ctx.arc(dx + 6, y, 2, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(dx + dw - 6, y, 2, 0, Math.PI * 2); ctx.fill();
    }

    ctx.strokeStyle = 'rgba(190,212,235,0.48)';
    ctx.lineWidth = 1.8;
    for (let x = wallX; x < W - 10; x += 20) {
      ctx.beginPath(); ctx.moveTo(x, wallTop - 22); ctx.lineTo(x + 20, wallTop - 2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x, wallTop - 2); ctx.lineTo(x + 20, wallTop - 22); ctx.stroke();
    }
    ctx.beginPath(); ctx.moveTo(wallX, wallTop - 12); ctx.lineTo(W, wallTop - 12); ctx.stroke();

    // 灯头 + 发光点
    const lampX = getLampX();
    const lampTop = LAMP.y - LAMP.headH / 2;
    ctx.fillStyle = '#4d5a6d';
    ctx.fillRect(lampX - LAMP.headW / 2, lampTop, LAMP.headW, LAMP.headH);
    ctx.fillStyle = '#647489';
    ctx.fillRect(lampX - LAMP.headW / 2, lampTop, LAMP.headW, 4);
    ctx.fillStyle = '#3a4556';
    ctx.fillRect(lampX - 6, lampTop - 16, 12, 20);
    ctx.fillStyle = 'rgba(255,248,215,0.98)';
    ctx.beginPath(); ctx.arc(lampX, lampTop + LAMP.headH + 1, 9, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,240,180,0.45)';
    ctx.beginPath(); ctx.arc(lampX, lampTop + LAMP.headH + 1, 17, 0, Math.PI * 2); ctx.fill();
  }

  /* ============ 绘制：车厢内已救出的小人（高兴跳动） ============ */
  function drawRescuedGuards() {
    const guards = state.rescuedGuards;
    const n = guards.length;
    if (n === 0) return;
    const padding = 16;
    const innerLeft = CARGO_LEFT + padding;
    const innerRight = CARGO_RIGHT - padding;
    const usable = innerRight - innerLeft;
    const spacing = n === 1 ? 0 : usable / (n - 1);
    const scale = Math.max(0.55, Math.min(0.95, spacing / 24));
    const baseY = GROUND - 62;

    guards.forEach((g, i) => {
      const x = n === 1 ? (innerLeft + innerRight) / 2 : innerLeft + spacing * i;
      // 高兴地上下跳动
      const bounce = Math.abs(Math.sin(g.bounce || 0)) * 8;
      const y = baseY - bounce;
      const rot = Math.sin((g.bounce || 0) * 2) * 0.08;  // 轻微左右摇晃

      ctx.save();
      ctx.globalAlpha = 0.95;
      ctx.translate(x, y);
      ctx.scale(scale, scale);
      ctx.rotate(rot);

      // 身体
      ctx.fillStyle = '#68798c';
      rr(-10, -70, 20, 36, 4); ctx.fill();
      ctx.save();
      rr(-10, -70, 20, 36, 4);
      ctx.clip();
      ctx.strokeStyle = 'rgba(232,242,252,0.5)';
      ctx.lineWidth = 2.5;
      for (let k = 0; k < 4; k++) {
        ctx.beginPath(); ctx.moveTo(-12, -66 + k * 9); ctx.lineTo(12, -66 + k * 9); ctx.stroke();
      }
      ctx.restore();

      // 头
      ctx.fillStyle = '#e0b894';
      ctx.beginPath(); ctx.arc(0, -80, 10, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#241c14';
      ctx.beginPath(); ctx.arc(0, -82, 10, Math.PI * 1.03, Math.PI * 1.97); ctx.fill();

      // 开心的眼睛（弧线 ^ ^）
      ctx.strokeStyle = '#241c14';
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(-3, -80, 1.8, Math.PI, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.arc(3, -80, 1.8, Math.PI, Math.PI * 2); ctx.stroke();

      // 微笑的嘴
      ctx.beginPath(); ctx.arc(0, -76, 2.5, 0.1 * Math.PI, 0.9 * Math.PI); ctx.stroke();

      // 举起的双手（庆祝）
      const armSwing = Math.sin((g.bounce || 0) * 2) * 3;
      ctx.strokeStyle = '#68798c';
      ctx.lineWidth = 5;
      ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(-10, -66); ctx.lineTo(-16 - armSwing, -80); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(10, -66); ctx.lineTo(16 + armSwing, -80); ctx.stroke();

      ctx.restore();
    });
  }

  /* ============ 绘制：卡车 ============ */
  function drawTruck() {
    const x = TRUCK_X;
    const base = GROUND;
    ctx.save();

    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.beginPath();
    ctx.ellipse(x + 170, base + 2, 175, 16, 0, 0, Math.PI * 2);
    ctx.fill();

    const wheels = [x + 85, x + 235, x + 285];
    wheels.forEach(wx => {
      ctx.fillStyle = '#0a0c10';
      ctx.beginPath(); ctx.arc(wx, base - 27, 27, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#1e2229';
      ctx.lineWidth = 2.2;
      for (let a = 0; a < Math.PI * 2; a += Math.PI / 9) {
        const x1 = wx + Math.cos(a) * 23;
        const y1 = base - 27 + Math.sin(a) * 23;
        const x2 = wx + Math.cos(a) * 27;
        const y2 = base - 27 + Math.sin(a) * 27;
        ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
      }
      const rimGrad = ctx.createRadialGradient(wx - 5, base - 32, 2, wx, base - 27, 18);
      rimGrad.addColorStop(0, '#939eae');
      rimGrad.addColorStop(0.6, '#5c6674');
      rimGrad.addColorStop(1, '#3c434e');
      ctx.fillStyle = rimGrad;
      ctx.beginPath(); ctx.arc(wx, base - 27, 17, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#2b3239';
      ctx.lineWidth = 2.4;
      for (let a = 0; a < Math.PI * 2; a += Math.PI / 6) {
        ctx.beginPath();
        ctx.moveTo(wx, base - 27);
        ctx.lineTo(wx + Math.cos(a) * 15, base - 27 + Math.sin(a) * 15);
        ctx.stroke();
      }
      ctx.fillStyle = '#c2cad6';
      ctx.beginPath(); ctx.arc(wx, base - 27, 6, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#6e7784';
      ctx.beginPath(); ctx.arc(wx, base - 27, 3, 0, Math.PI * 2); ctx.fill();
    });

    ctx.fillStyle = '#181c1a';
    rr(x + 45, base - 62, 285, 16, 4); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.06)';
    rr(x + 46, base - 61, 283, 3, 2); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    rr(x + 46, base - 50, 283, 4, 2); ctx.fill();

    ctx.fillStyle = '#2a3038';
    rr(x + 28, base - 58, 22, 20, 3); ctx.fill();
    rr(x + 308, base - 58, 22, 20, 3); ctx.fill();
    ctx.fillStyle = '#3e464f';
    rr(x + 30, base - 56, 18, 5, 2); ctx.fill();
    rr(x + 310, base - 56, 18, 5, 2); ctx.fill();

    const boxLeft = CARGO_LEFT, boxRight = CARGO_RIGHT;
    const boxTop = base - 155, boxBottom = base - 60;

    // 车厢内部（更暗，因为小人跳进去）
    const boxGrad = ctx.createLinearGradient(0, boxTop, 0, boxBottom);
    boxGrad.addColorStop(0, '#77875c');
    boxGrad.addColorStop(0.5, '#5d6d46');
    boxGrad.addColorStop(1, '#3d4832');
    ctx.fillStyle = boxGrad;
    ctx.fillRect(boxLeft, boxTop, boxRight - boxLeft, boxBottom - boxTop);

    ctx.fillStyle = 'rgba(255,255,255,0.10)';
    ctx.fillRect(boxLeft + 2, boxTop + 2, boxRight - boxLeft - 4, 5);

    ctx.strokeStyle = 'rgba(22,28,18,0.45)';
    ctx.lineWidth = 1.6;
    for (let i = 1; i < 5; i++) {
      const yy = boxTop + (boxBottom - boxTop) * i / 5;
      ctx.beginPath(); ctx.moveTo(boxLeft, yy); ctx.lineTo(boxRight, yy); ctx.stroke();
    }

    // 顶篷
    ctx.save();
    const canvasGrad = ctx.createLinearGradient(0, base - 215, 0, base - 145);
    canvasGrad.addColorStop(0, '#8f9476');
    canvasGrad.addColorStop(0.5, '#727a5e');
    canvasGrad.addColorStop(1, '#555c44');
    ctx.fillStyle = canvasGrad;
    ctx.beginPath();
    ctx.moveTo(boxLeft - 6, boxTop + 8);
    ctx.quadraticCurveTo((boxLeft + boxRight) / 2, base - 218, boxRight + 6, boxTop + 8);
    ctx.lineTo(boxRight + 6, boxTop + 26);
    ctx.quadraticCurveTo((boxLeft + boxRight) / 2, base - 196, boxLeft - 6, boxTop + 26);
    ctx.closePath(); ctx.fill();
    ctx.restore();

    ctx.strokeStyle = 'rgba(45,50,35,0.55)';
    ctx.lineWidth = 1.8;
    for (let i = 1; i < 6; i++) {
      const t = i / 6;
      const arcX = boxLeft + (boxRight - boxLeft) * t;
      const hAt = base - 218 + Math.abs(t - 0.5) * 60;
      ctx.beginPath(); ctx.moveTo(arcX, hAt); ctx.lineTo(arcX, boxTop + 20); ctx.stroke();
    }
    ctx.strokeStyle = 'rgba(35,40,28,0.75)';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(boxLeft - 6, boxTop + 22);
    ctx.quadraticCurveTo((boxLeft + boxRight) / 2, base - 200, boxRight + 6, boxTop + 22);
    ctx.stroke();

    ctx.fillStyle = '#4e5939';
    ctx.fillRect(boxRight, boxTop + 5, 10, boxBottom - boxTop - 5);
    ctx.strokeStyle = '#2a3020';
    ctx.lineWidth = 2;
    ctx.strokeRect(boxRight, boxTop + 5, 10, boxBottom - boxTop - 5);

    ctx.fillStyle = '#0a0c10';
    ctx.beginPath(); ctx.arc(boxRight + 16, base - 95, 22, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#1e2229';
    ctx.lineWidth = 1.8;
    for (let a = 0; a < Math.PI * 2; a += Math.PI / 6) {
      ctx.beginPath();
      ctx.moveTo(boxRight + 16 + Math.cos(a) * 14, base - 95 + Math.sin(a) * 14);
      ctx.lineTo(boxRight + 16 + Math.cos(a) * 21, base - 95 + Math.sin(a) * 21);

    }
    ctx.fillStyle = '#3c434e';
    ctx.beginPath(); ctx.arc(boxRight + 16, base - 95, 13, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#6e7784';

    const cabLeft = x + 45, cabRight = x + 148;

    cabGrad.addColorStop(1, '#3e4930');
    ctx.fillStyle = cabGrad;
    ctx.fillRect(cabLeft, cabTop, cabRight - cabLeft, cabBottom - cabTop);
    ctx.fillStyle = 'rgba(255,255,255,0.10)';
    ctx.fillRect(cabLeft + 2, cabTop + 2, cabRight - cabLeft - 4, 6);
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.fillRect(cabLeft, cabBottom - 6, cabRight - cabLeft, 6);

    const winGrad = ctx.createLinearGradient(cabLeft + 10, cabTop + 10, cabLeft + 75, cabTop + 58);
    winGrad.addColorStop(0, 'rgba(170,215,240,0.75)');
    winGrad.addColorStop(0.5, 'rgba(105,150,185,0.6)');
    winGrad.addColorStop(1, 'rgba(60,100,130,0.55)');
    ctx.fillStyle = winGrad;
    ctx.beginPath();
    ctx.moveTo(cabLeft + 8, cabTop + 8);
    ctx.lineTo(cabLeft + 66, cabTop + 8);
    ctx.lineTo(cabLeft + 62, cabTop + 56);
    ctx.lineTo(cabLeft + 8, cabTop + 56);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.24)';

    ctx.lineWidth = 2.4;

    ctx.strokeStyle = 'rgba(25,30,20,0.7)';
    ctx.lineWidth = 1.8;
    ctx.beginPath(); ctx.moveTo(cabLeft + 68, cabTop + 8); ctx.lineTo(cabLeft + 68, cabBottom); ctx.stroke();

    ctx.fillStyle = '#2a3028';
    rr(cabLeft + 106, cabTop + 60, 16, 5, 2); ctx.fill();

    ctx.fillStyle = 'rgba(216,226,189,0.15)';
    ctx.beginPath(); ctx.arc(cabLeft + 40, cabTop + 80, 17, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#d8e2bd';
    ctx.font = 'bold 22px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('★', cabLeft + 40, cabTop + 80);

    ctx.fillStyle = '#1a1f26';
    rr(cabLeft - 14, base - 130, 16, 62, 3); ctx.fill();
    ctx.strokeStyle = '#4d5661';
    ctx.lineWidth = 1.6;
    for (let gy = base - 126; gy < base - 72; gy += 7) {
      ctx.beginPath(); ctx.moveTo(cabLeft - 12, gy); ctx.lineTo(cabLeft - 2, gy); ctx.stroke();
    }

    const headGrad = ctx.createRadialGradient(cabLeft - 6, base - 72, 1, cabLeft - 6, base - 72, 11);

    rr(cabLeft - 22, base - 64, 28, 22, 3); ctx.fill();

    rr(cabLeft + 52, cabTop - 32, 22, 14, 2); ctx.fill();

  function drawHostage() {
    const h = state.hostage;
    if (!h || h.alpha <= 0) return;
    ctx.save();
    ctx.globalAlpha = h.alpha;
    ctx.translate(h.x, h.y);
    if (h.fall > 0) ctx.rotate(h.fall * Math.PI * 0.47);
    const swing = Math.sin(h.walkPhase) * 11;

    ctx.strokeStyle = '#39434f';
    ctx.lineWidth = 8;
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-1, -46); ctx.lineTo(-swing, -3); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(1, -46); ctx.lineTo(swing, -3); ctx.stroke();

    ctx.fillStyle = '#68798c';
    rr(-14, -90, 28, 48, 6); ctx.fill();
    ctx.save();
    rr(-14, -90, 28, 48, 6);
    ctx.clip();
    ctx.strokeStyle = 'rgba(232,242,252,0.55)';
    ctx.lineWidth = 3;
    for (let i = 0; i < 5; i++) {
      ctx.beginPath(); ctx.moveTo(-16, -86 + i * 11); ctx.lineTo(16, -86 + i * 11); ctx.stroke();
    }
    ctx.restore();

    ctx.strokeStyle = '#68798c';
    ctx.lineWidth = 7;
    ctx.beginPath(); ctx.moveTo(-10, -84); ctx.lineTo(-15 - swing * 0.4, -52); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(10, -84); ctx.lineTo(15 + swing * 0.4, -52); ctx.stroke();

    ctx.fillStyle = '#e0b894';
    ctx.beginPath(); ctx.arc(0, -102, 13, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#241c14';
    ctx.beginPath(); ctx.arc(0, -104, 13, Math.PI * 1.03, Math.PI * 1.97); ctx.fill();

    if (!h.dead) {
      ctx.fillStyle = '#241c14';
      ctx.beginPath(); ctx.arc(-4, -101, 1.7, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(4, -101, 1.7, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.strokeStyle = '#241c14';
      ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(-6,-104); ctx.lineTo(-2,-99); ctx.moveTo(-2,-104); ctx.lineTo(-6,-99); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(2,-104); ctx.lineTo(6,-99); ctx.moveTo(6,-104); ctx.lineTo(2,-99); ctx.stroke();
    }
    ctx.restore();
  }

  function drawBubble() {
    const h = state.hostage;
    if (!h || h.alpha <= 0) return;
    if (state.phase !== 'ask' && state.phase !== 'enter' && state.phase !== 'rescue') return;
    if (!state.word) return;

    const txt = state.word.jp || '？';
    const fs = txt.length >= 4 ? 26 : 32;
    ctx.save();
    ctx.font = 'bold ' + fs + 'px "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", "PingFang SC", sans-serif';
    const tw = ctx.measureText(txt).width;
    const bw = Math.max(tw + 48, 138);
    const bh = 64;
    const bx = h.x - bw / 2;
    const by = h.y - 210 + Math.sin(performance.now() / 420) * 2.5;

    ctx.shadowColor = 'rgba(110,200,255,0.9)';
    ctx.shadowBlur = 20;
    ctx.fillStyle = 'rgba(246,251,255,0.97)';
    rr(bx, by, bw, bh, 14); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(h.x - 12, by + bh - 1);
    ctx.lineTo(h.x, by + bh + 18);
    ctx.lineTo(h.x + 12, by + bh - 1);
    ctx.closePath(); ctx.fill();
    ctx.shadowBlur = 0;

    ctx.fillStyle = '#0e1720';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(txt, h.x, by + bh / 2 + 4);

    ctx.font = '11px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillStyle = 'rgba(90,120,150,0.85)';
    ctx.fillText('原形', h.x, by + 11);

    ctx.restore();
    ctx.textAlign = 'start';
    ctx.textBaseline = 'alphabetic';
  }

  function drawEffects() {
    if (state.muzzle > 0 && state.bullet.y) {
      ctx.save();
      ctx.globalAlpha = Math.min(1, state.muzzle * 9);
      const mx = W - 30, my = state.bullet.y;
      const g2 = ctx.createRadialGradient(mx, my, 0, mx, my, 70);
      g2.addColorStop(0, 'rgba(255,245,190,0.95)');
      g2.addColorStop(0.4, 'rgba(255,190,70,0.5)');
      g2.addColorStop(1, 'rgba(255,160,40,0)');
      ctx.fillStyle = g2;
      ctx.beginPath(); ctx.arc(mx, my, 70, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
    if (state.bullet.active) {
      ctx.save();
      ctx.strokeStyle = '#ffe066';
      ctx.lineWidth = 3.5;
      ctx.lineCap = 'round';
      ctx.shadowColor = '#ffcc33';
      ctx.shadowBlur = 16;
      ctx.beginPath();
      ctx.moveTo(state.bullet.x, state.bullet.y);
      ctx.lineTo(state.bullet.x + 34, state.bullet.y);
      ctx.stroke();
      ctx.restore();
    }
    for (const p of state.particles) {
      ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawLightning() {
    const L = state.lightning;
    if (!L || !L.active) return;
    const t = Math.max(0, L.life / L.maxLife);
    ctx.save();
    ctx.shadowColor = '#cfe8ff';
    ctx.shadowBlur = 32;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    L.segments.forEach(seg => {
      const pts = seg.points;
      if (pts.length < 2) return;
      ctx.strokeStyle = 'rgba(150,200,255,' + (0.38 * t) + ')';
      ctx.lineWidth = seg.width * 3.6;
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(215,238,255,' + (0.92 * t) + ')';
      ctx.lineWidth = seg.width;
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,' + t + ')';
      ctx.lineWidth = seg.width * 0.42;
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
      ctx.stroke();
    });
    ctx.restore();
  }

  function drawFlash() {
    const L = state.lightning;
    if (L && L.flash > 0) {
      ctx.save();
      ctx.fillStyle = 'rgba(200,230,255,' + (L.flash * 0.4) + ')';
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }
    if (state.timeUpFlash > 0) {
      ctx.save();
      ctx.fillStyle = 'rgba(255,80,80,' + (state.timeUpFlash * 0.28) + ')';
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }
  }

  function drawTimer() {
    if (state.phase !== 'ask') return;
    const t = state.timeLeft;
    const ratio = Math.max(0, t / TIME_LIMIT);
    const bw = 360, bh = 46;
    const bx = (W - bw) / 2, by = 18;

    ctx.save();
    ctx.fillStyle = 'rgba(8,12,20,0.82)';
    rr(bx, by, bw, bh, 23); ctx.fill();
    const borderColor = ratio < 0.3 ? 'rgba(255,90,90,0.95)' : 'rgba(95,208,255,0.65)';
    ctx.strokeStyle = borderColor;
    ctx.lineWidth = 2.5;
    rr(bx, by, bw, bh, 23); ctx.stroke();

    const px = bx + 6, py = by + 6;
    const pw = (bw - 12) * ratio, ph = bh - 12;
    let c1, c2;
    if (ratio < 0.3) { c1 = '#ff6b6b'; c2 = '#c0392b'; }
    else if (ratio < 0.6) { c1 = '#ffd166'; c2 = '#e67e22'; }
    else { c1 = '#7fe0ff'; c2 = '#35b6e6'; }
    const grad = ctx.createLinearGradient(px, py, px + Math.max(pw, 1), py);
    grad.addColorStop(0, c1);
    grad.addColorStop(1, c2);
    ctx.fillStyle = grad;
    rr(px, py, Math.max(0, pw), ph, 17); ctx.fill();

    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 21px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineWidth = 3;
    ctx.strokeStyle = 'rgba(0,0,0,0.55)';
    const label = Math.ceil(t) + ' 秒';
    ctx.strokeText(label, W / 2, by + bh / 2 + 1);
    ctx.fillText(label, W / 2, by + bh / 2 + 1);

    if (ratio < 0.3) {
      const blink = Math.sin(performance.now() / 100) * 0.4 + 0.6;
      ctx.fillStyle = 'rgba(255,90,90,' + (blink * 0.14) + ')';
      ctx.fillRect(0, 0, W, H);
    }
    ctx.restore();
    ctx.textAlign = 'start';
    ctx.textBaseline = 'alphabetic';
  }

  /* ============ 准备开始提示（画在 canvas 上） ============ */
  function drawReadyPrompt() {
    if (!state.readyToStart || state.phase !== 'idle') return;
    ctx.save();
    // 半透明遮罩
    ctx.fillStyle = 'rgba(5,10,18,0.55)';
    ctx.fillRect(0, 0, W, H);

    // 标题
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = 'bold 40px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillStyle = '#8fd6ff';
    ctx.shadowColor = 'rgba(95,208,255,0.9)';
    ctx.shadowBlur = 26;
    ctx.fillText('准备开始', W / 2, H / 2 - 40);
    ctx.shadowBlur = 0;

    // 副标题
    ctx.font = '20px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillStyle = '#ffd166';
    ctx.fillText('点击屏幕 / 按任意键  开始游戏', W / 2, H / 2 + 26);

    // 呼吸圈
    const pulse = Math.sin(performance.now() / 350) * 0.5 + 0.5;
    ctx.strokeStyle = 'rgba(143,214,255,' + (0.35 + pulse * 0.4) + ')';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(W / 2, H / 2 + 100, 34 + pulse * 6, 0, Math.PI * 2);
    ctx.stroke();

    // 播放三角
    ctx.fillStyle = 'rgba(143,214,255,' + (0.6 + pulse * 0.4) + ')';
    ctx.beginPath();
    ctx.moveTo(W / 2 - 12, H / 2 + 88);
    ctx.lineTo(W / 2 + 16, H / 2 + 100);
    ctx.lineTo(W / 2 - 12, H / 2 + 112);
    ctx.closePath();
    ctx.fill();

    ctx.restore();
    ctx.textAlign = 'start';
    ctx.textBaseline = 'alphabetic';
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#0a0c11';
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    if (state.shake > 0) {
      const amt = state.shake * 14;
      ctx.translate((Math.random() - 0.5) * amt, (Math.random() - 0.5) * amt);
    }
    drawBg();
    drawTruck();
    drawRescuedGuards();   // 车厢内跳动的小人
    drawHostage();
    drawBubble();
    drawEffects();
    drawLightning();
    ctx.restore();

    drawFlash();
    drawTimer();
    drawReadyPrompt();
  }

  let lastT = performance.now();
  function loop(t) {
    const dt = Math.min((t - lastT) / 1000, 0.05);
    lastT = t;
    if (!paused) update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  function updateHUD() {
    document.getElementById('rescued').textContent = state.rescued;
    document.getElementById('target').textContent = state.totalRounds;
    document.getElementById('groupTag').textContent = GROUPS[currentGroupIndex].name;
  }

  function endGame() {
    state.phase = 'over';
    document.getElementById('options').innerHTML = '';
    // 游戏结束：停止悲伤（如果还在），播放欢快
    BGM.playHappy();
    const ov = document.getElementById('overlay');
    const title = document.getElementById('ovTitle');
    title.textContent = '本 轮 结 束';
    title.style.color = state.rescued === state.totalRounds ? '#3ddc84' : '#ffd166';
    document.getElementById('ovText').innerHTML =
      '本轮共 <b>' + state.totalRounds + '</b> 名人质<br>' +
      '成功解救 <b>' + state.rescued + '</b> 人';
    ov.classList.remove('hidden');
  }

  /* ============ 开始 / 重启 ============ */
  function startGroup(idx) {
    if (!GROUPS[idx] || !GROUPS[idx].words || GROUPS[idx].words.length === 0) {
      GROUPS[idx] = JSON.parse(JSON.stringify(DEFAULT_GROUPS[idx]));
      saveGroupsToStorage();
    }
    currentGroupIndex = idx;
    WORDS = GROUPS[idx].words;
    wordQueue = [];
    state.rescued = 0;
    state.answered = 0;
    state.totalRounds = Math.max(1, Math.min(10, WORDS.length));
    state.word = null;
    state.particles = [];
    state.muzzle = 0;
    state.lightning = { active: false, life: 0, maxLife: 0, flash: 0, segments: [] };
    state.shake = 0;
    state.timeLeft = TIME_LIMIT;
    state.timeUpFlash = 0;
    state.rescuedGuards = [];
    state.jump = null;
    state.hostage = null;
    // 关键：先进入"准备开始"状态
    state.phase = 'idle';
    state.readyToStart = true;
    document.getElementById('overlay').classList.add('hidden');
    document.getElementById('options').innerHTML = '';
    // 暂停游戏循环
    paused = false;
    updateHUD();
  }

  // 用户在准备界面点击/按键后真正开始
  function beginPlaying() {
    if (!state.readyToStart) return;
    state.readyToStart = false;
    BGM.init();
    BGM.playHappy();
    nextRound();
  }

  function restart() {
    startGroup(currentGroupIndex);
  }

  /* ============ 菜单 ============ */
  function renderMenu() {
    const grid = document.getElementById('groupGrid');
    grid.innerHTML = '';
    GROUPS.forEach((g, i) => {
      const card = document.createElement('button');
      card.className = 'group-card';
      const preview = g.words.slice(0, 12).map(w => w.jp || '？').join(' · ');
      card.innerHTML =
        '<div class="group-name">' + escapeHtml(g.name) + '</div>' +
        '<div class="group-count">共 ' + g.words.length + ' 个单词</div>' +
        '<div class="group-words">' + escapeHtml(preview) + (g.words.length > 12 ? ' …' : '') + '</div>';
      card.addEventListener('pointerdown', (e) => {
        if (e.button !== undefined && e.button !== 0) return;
        e.preventDefault();
        closeMenuAndStart(i);
      }, { passive: false });
      grid.appendChild(card);
    });
  }

  let menuAnimating = false;
  function closeMenuAndStart(idx) {
    if (menuAnimating) return;
    menuAnimating = true;
    const menu = document.getElementById('menu');
    menu.classList.add('fade-out');
    setTimeout(() => {
      menu.classList.add('hidden');
      menu.classList.remove('fade-out');
      menuAnimating = false;
      startGroup(idx);
    }, 380);
  }

  function openMenu() {
    paused = true;
    BGM.stop();
    const menu = document.getElementById('menu');
    menu.classList.remove('hidden');
    void menu.offsetWidth;
    menu.classList.remove('fade-out');
    renderMenu();
  }

  /* ============ 词库编辑器 ============ */
  const editorEl = document.getElementById('editor');
  const editorListEl = document.getElementById('editorList');

  function openEditor() {
    paused = true;
    editorEl.classList.remove('hidden');
    document.getElementById('editGroupName').textContent = GROUPS[currentGroupIndex].name;
    renderEditor();
  }

  function closeEditor() {
    editorEl.classList.add('hidden');
    const res = saveGroupsToStorage();
    if (res.ok && !res.memoryOnly) showToast('✓ 词库已保存到浏览器');
    else if (res.ok && res.memoryOnly) showToast('⚠ 浏览器存储不可用，仅本次会话有效（刷新后丢失）', true);
    else showToast('⚠ 保存失败：' + (res.reason || '未知错误'), true);
    startGroup(currentGroupIndex);
  }

  function renderEditor() {
    const group = GROUPS[currentGroupIndex];
    const words = group.words;
    editorListEl.innerHTML = '';

    if (words.length === 0) {
      const empty = document.createElement('div');
      empty.style.cssText = 'color:#7f93a8;text-align:center;padding:60px 20px;font-size:15px;';
      empty.textContent = '本组词库是空的，点击上方「+ 添加新单词」来创建。';
      editorListEl.appendChild(empty);
      return;
    }

    words.forEach((w, wi) => {
      const card = document.createElement('div');
      card.className = 'word-card';

      const head = document.createElement('div');
      head.className = 'word-head';
      const lbl = document.createElement('span');
      lbl.className = 'word-label';
      lbl.textContent = '原形';
      const jpInput = document.createElement('input');
      jpInput.className = 'word-jp';
      jpInput.type = 'text';
      jpInput.value = w.jp;
      jpInput.placeholder = '例如：答える';
      jpInput.addEventListener('input', () => { w.jp = jpInput.value; });

      const delWordBtn = document.createElement('button');
      delWordBtn.className = 'btn-del-word';
      delWordBtn.textContent = '删除单词';
      delWordBtn.addEventListener('click', () => {
        if (confirm('确定删除「' + (w.jp || '未命名') + '」吗？')) {
          group.words.splice(wi, 1);
          renderEditor();
        }
      });
      head.appendChild(lbl); head.appendChild(jpInput); head.appendChild(delWordBtn);
      card.appendChild(head);

      const optList = document.createElement('div');
      optList.className = 'opt-list';
      w.options.forEach((opt, oi) => {
        const row = document.createElement('div');
        row.className = 'opt-row' + (opt.correct ? ' is-correct' : '');
        const txt = document.createElement('input');
        txt.className = 'opt-text';
        txt.type = 'text';
        txt.value = opt.text;
        txt.placeholder = '选项内容';
        txt.addEventListener('input', () => { opt.text = txt.value; });

        const markBtn = document.createElement('button');
        markBtn.className = 'btn-mark-correct';
        markBtn.textContent = opt.correct ? '✓ 正确' : '标为正确';
        markBtn.addEventListener('click', () => {
          w.options.forEach(o => o.correct = false);
          opt.correct = true;
          renderEditor();
        });

        const delOptBtn = document.createElement('button');
        delOptBtn.className = 'btn-del-opt';
        delOptBtn.textContent = '×';
        delOptBtn.title = w.options.length <= 2 ? '至少保留 2 个选项' : '删除此选项';
        delOptBtn.disabled = w.options.length <= 2;
        delOptBtn.addEventListener('click', () => {
          if (w.options.length <= 2) return;
          w.options.splice(oi, 1);
          if (!w.options.some(o => o.correct)) w.options[0].correct = true;
          renderEditor();
        });

        row.appendChild(txt); row.appendChild(markBtn); row.appendChild(delOptBtn);
        optList.appendChild(row);
      });
      card.appendChild(optList);

      const addOptBtn = document.createElement('button');
      addOptBtn.className = 'btn-add-opt';
      addOptBtn.textContent = '+ 添加选项';
      addOptBtn.addEventListener('click', () => {
        w.options.push({ text:'', correct:false });
        renderEditor();
        requestAnimationFrame(() => {
          const cards = editorListEl.querySelectorAll('.word-card');
          const targetCard = cards[wi];
          if (!targetCard) return;
          const inputs = targetCard.querySelectorAll('.opt-text');
          const last = inputs[inputs.length - 1];
          if (last) { last.focus(); last.scrollIntoView({ block:'nearest' }); }
        });
      });
      card.appendChild(addOptBtn);
      editorListEl.appendChild(card);
    });
  }

  /* ============ 事件绑定 ============ */
  document.getElementById('restart').addEventListener('click', restart);
  document.getElementById('toMenu').addEventListener('click', () => {
    document.getElementById('overlay').classList.add('hidden');
    openMenu();
  });
  document.getElementById('btnMenu').addEventListener('click', openMenu);
  document.getElementById('btnEditor').addEventListener('click', openEditor);
  document.getElementById('closeEditor').addEventListener('click', closeEditor);

  document.getElementById('addWord').addEventListener('click', () => {
    const group = GROUPS[currentGroupIndex];
    group.words.push({
      jp: '',
      options: [
        { text:'', correct:true  },
        { text:'', correct:false },
        { text:'', correct:false },
        { text:'', correct:false }
      ]
    });
    renderEditor();
    requestAnimationFrame(() => {
      const cards = editorListEl.querySelectorAll('.word-card');
      const last = cards[cards.length - 1];
      if (last) {
        last.scrollIntoView({ block:'center', behavior:'smooth' });
        const jp = last.querySelector('.word-jp');
        if (jp) jp.focus();
      }
    });
  });

  document.getElementById('resetWords').addEventListener('click', () => {
    if (confirm('确定恢复「' + GROUPS[currentGroupIndex].name + '」的默认词库吗？当前修改将丢失。')) {
      GROUPS[currentGroupIndex] = JSON.parse(JSON.stringify(DEFAULT_GROUPS[currentGroupIndex]));
      renderEditor();
      showToast('已恢复默认词库，记得点「完成并保存」');
    }
  });

  // 准备界面：点击 canvas / 键盘 开始游戏
  cv.addEventListener('pointerdown', (e) => {
    if (state.readyToStart && state.phase === 'idle') {
      e.preventDefault();
      beginPlaying();
    }
  }, { passive: false });
  document.addEventListener('keydown', (e) => {
    if (state.readyToStart && state.phase === 'idle') {
      e.preventDefault();
      beginPlaying();
    }
  });

  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });

  /* ============ 启动 ============ */
  updateHUD();
  renderMenu();
  openMenu();
  requestAnimationFrame(loop);

  if (!Storage.isAvailable()) {
    setTimeout(() => {
      showToast('⚠ 浏览器本地存储不可用，词库修改仅本次会话有效', true);
    }, 800);
  }

})();
</script>
</body>
</html>
